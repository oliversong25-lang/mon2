<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>투자 원칙</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="lib/app.css?v=20260814-1">
  <script src="lib/supabase-config.js?v=20260811-1"></script>
  <script src="lib/account-store.js"></script>
  <script src="lib/auth-guard.js"></script>
  <style>
    /* 이 화면에는 예시가 없다. 빈 줄과 추가 버튼뿐이다 — 우리가 본보기를 주면 그 순간
       우리의 관점이 사용자의 원칙에 들어간다. */
    .q { margin-top:var(--space-6); }
    .q label { display:block; font-size:var(--font-md); font-weight:600; line-height:1.6; }
    .q-note { margin-top:var(--space-2); color:var(--dim); font-size:var(--font-xs); line-height:1.6; }
    .field { width:100%; padding:var(--space-3) var(--space-4); border:var(--border) solid var(--line);
      border-radius:var(--radius-md); background:var(--surface-2); color:inherit; font:inherit; }
    .field:focus { outline:2px solid var(--brand-ink); outline-offset:1px; }

    .plist { list-style:none; margin:var(--space-4) 0 0; padding:0; }
    .pitem { padding:var(--space-4) 0; border-top:var(--border) solid var(--line); }
    .pitem:first-child { border-top:0; }
    .pitem-line { display:flex; gap:var(--space-3); align-items:flex-start; }
    .pitem-text { flex:1; min-width:0; font-size:var(--font-md); line-height:1.6; word-break:keep-all; }
    .pitem-origin { margin-top:var(--space-1); color:var(--dim); font-size:var(--font-xs); }
    .pitem-actions { display:flex; flex:none; gap:var(--space-2); }
    .kind-tag { flex:none; margin-top:.2rem; padding:0 var(--space-2); border-radius:var(--radius-round);
      background:var(--surface-2); color:var(--muted); font-size:var(--font-xs); font-weight:600; }
    .mini { padding:var(--space-1) var(--space-3); border:var(--border) solid var(--line);
      border-radius:var(--radius-round); background:transparent; color:var(--muted);
      font:inherit; font-size:var(--font-xs); font-weight:700; cursor:pointer; }
    .mini:disabled { opacity:.5; cursor:default; }
    /* 핵심 표시. 이것 하나만 기록 화면의 동작을 바꾼다 — 그래서 켜진 상태가 분명히 보여야 한다. */
    .core[aria-pressed="true"] { border-color:var(--brand-ink); color:var(--ink); background:var(--brand-soft); }
    .edit-row { display:flex; gap:var(--space-2); margin-top:var(--space-3); }
    .edit-row .field { flex:1; }

    .kinds { display:flex; flex-wrap:wrap; gap:var(--space-2); margin-top:var(--space-3); }
    .kinds button { padding:var(--space-2) var(--space-4); border:var(--border) solid var(--line);
      border-radius:var(--radius-md); background:var(--surface-2); color:inherit; font:inherit; cursor:pointer; }
    .kinds button[aria-pressed="true"] { border-color:var(--brand-ink); font-weight:700; }
    .add-row { display:flex; flex-wrap:wrap; gap:var(--space-3); align-items:center; margin-top:var(--space-3); }
    .add-row .field { flex:1 1 16rem; }
    .btn { padding:var(--space-3) var(--space-5); border:var(--border) solid var(--line);
      border-radius:var(--radius-md); background:var(--surface-2); color:inherit;
      font:inherit; font-weight:600; cursor:pointer; }
    .btn:disabled { opacity:.5; cursor:default; }
    .notice { margin-top:var(--space-4); padding:var(--space-3) var(--space-4); border:var(--border) solid var(--line);
      border-radius:var(--radius-md); background:var(--surface-2); color:var(--muted); font-size:var(--font-sm); line-height:1.7; }
    .notice button { margin-left:var(--space-2); }

    .rev { padding:var(--space-4) 0; border-top:var(--border) solid var(--line); }
    .rev:first-child { border-top:0; }
    .rev-head { display:flex; flex-wrap:wrap; gap:var(--space-3); align-items:baseline; }
    .rev-when { font-weight:600; font-variant-numeric:tabular-nums; }
    .rev-reason { color:var(--muted); font-size:var(--font-sm); }
    .rev-body { margin-top:var(--space-3); color:var(--dim); font-size:var(--font-sm); line-height:1.8; }
    .rev-body b { color:var(--muted); font-weight:600; }
    .rev-body ul { margin:0; padding-left:var(--space-5); }
    .soon-body { color:var(--dim); font-size:var(--font-sm); line-height:1.7; }
  </style>
</head>
<body>
<div id="app"></div>
<script src="lib/session.js"></script>
<script src="lib/shell.js?v=20260901-1"></script>
<script src="lib/format.js"></script>
<script src="lib/journal-store.js?v=20260914-1"></script>
<script>
// 투자 원칙 화면.
//
// ── 경계 ───────────────────────────────────────────────────────────────────
// 우리는 **받아 적기만 한다.** 원칙을 제안하지 않는다. 예시를 적으면 예시가 제안으로
// 읽히고, 흐린 글씨의 문장도 본보기로 읽힌다. 그래서 이 화면에는 예시도 placeholder도
// 기본 항목도 없다. 빈 목록에서 시작한다.
//
// ── 왜 목록인가 (트랙 40) ───────────────────────────────────────────────────
// 원칙과 결정이 서로 닿지 않았다. "3년 이상 보유한다"를 한 화면에 적고 다른 화면에서
// 넉 달 만에 팔아도 제품은 아무것도 알아채지 못했다. 원칙을 한 줄씩 적어 두면 의사결정
// 기록이 그 줄들을 **그대로** 되돌려 보여줄 수 있다. 문장형 칸으로는 그럴 수 없다.
//
// ── 저장 ───────────────────────────────────────────────────────────────────
// 바꾼 것은 **저장을 눌러야** 굳는다. 저장하면 현재 원칙이 갱신되고 이력에 한 줄이
// 덧붙는다(이력은 지우거나 고칠 수 없다). 저장 전 변경은 이 기기에 초안으로 남는다.
const { escapeHtml } = Format;
const KINDS = JournalStore.KINDS;

let doc = { version: 2, items: [], migratedFrom: null, migrated: false };
let items = [];
let revisions = [];
let records = [];
let loaded = false;
let error = null;
let busy = false;
let dirty = false;
let loadFailed = false;
let newKind = "principle";
let editingId = null;
let flash = null; // { text, undo } — 방금 한 일과 그 결과를 말한다
let restoredDraft = false;
let deleted = null;

function navOptions() {
  const state = SessionStore.read();
  return { assetCounts: Shell.countByGroup(state.assets) };
}

// 이 항목에 답한 과거 기록 수. 지우거나 고칠 때 무엇이 걸려 있는지 말하려고 센다.
function answeredCount(id) {
  return records.filter((rec) => (rec.principle_answers || []).some((a) => a.principleId === id && !a.skipped)).length;
}

function persistDraft() {
  if (loadFailed) return;
  const newText = document.getElementById("new-text");
  const reason = document.getElementById("reason");
  JournalStore.saveDraft("principles", {
    items,
    dirty,
    newKind,
    newText: newText ? newText.value : "",
    reason: reason ? reason.value : "",
    baseUpdatedAt: doc.updatedAt || null,
  });
}

function markChanged() {
  dirty = true;
  persistDraft();
}

function head() {
  return `<div class="page-head">
    <div><p class="eyebrow">기록</p><h1>투자 원칙</h1>
      <div class="sub">받아 적기만 합니다. 한 줄에 하나씩 쓰고, 바뀌면 언제 바뀌었는지가 남습니다.</div></div>
  </div>`;
}

function itemRow(item) {
  const editing = editingId === item.id;
  const n = answeredCount(item.id);
  const origin = item.origin && item.origin.prompt
    ? `<div class="pitem-origin">예전 원칙 화면의 질문 "${escapeHtml(item.origin.prompt)}"에 쓴 답</div>` : "";
  const body = editing
    ? `<div class="edit-row">
        <input class="field" id="edit-text" type="text" aria-label="고칠 문구" value="${escapeHtml(item.text)}">
        <button type="button" class="mini" data-edit-ok="${escapeHtml(item.id)}">확인</button>
        <button type="button" class="mini" data-edit-cancel>취소</button>
      </div>
      <div class="q-note">${n
        ? `이미 쓴 기록 ${n}건은 <b>고치기 전 문구에 대한 답</b>으로 남습니다. 기록마다 답할 당시의 문구가 함께 저장돼 있습니다.`
        : "이 항목에 답한 기록은 아직 없습니다."}</div>`
    : "";
  return `<li class="pitem" data-item="${escapeHtml(item.id)}">
    <div class="pitem-line">
      <span class="kind-tag">${escapeHtml(KINDS[item.kind] || KINDS.principle)}</span>
      <div class="pitem-text">${escapeHtml(item.text)}${origin}</div>
      <div class="pitem-actions">
        <button type="button" class="mini core" data-core="${escapeHtml(item.id)}" aria-pressed="${item.core}"
          aria-label="핵심 표시 ${item.core ? "끄기" : "켜기"}" ${loadFailed ? "disabled" : ""}>★ 핵심</button>
        <button type="button" class="mini" data-edit="${escapeHtml(item.id)}" ${loadFailed || editing ? "disabled" : ""}>고치기</button>
        <button type="button" class="mini" data-delete="${escapeHtml(item.id)}" ${loadFailed ? "disabled" : ""}>지우기</button>
      </div>
    </div>
    ${body}
  </li>`;
}

function listCard() {
  const coreCount = items.filter((item) => item.core).length;
  const migrated = doc.migrated && !restoredDraft
    ? `<div class="notice">예전 원칙 화면에 쓴 답 ${doc.items.length}개를 목록으로 옮겼습니다. 원래 질문은 각 항목 아래에 작게 남겼고,
       원문은 아래 바뀐 기록에 그대로 있습니다. 저장하면 이 목록 모양으로 굳습니다.</div>` : "";
  const restored = restoredDraft
    ? `<div class="notice">저장하지 않은 변경을 이 기기에서 되살렸습니다.</div>` : "";
  const flashBox = flash
    ? `<div class="notice" data-flash>${flash.text}${flash.undo ? ` <button type="button" class="mini" data-undo>되돌리기</button>` : ""}</div>` : "";
  const list = items.length
    ? `<ol class="plist">${items.map(itemRow).join("")}</ol>`
    : `<p class="soon-body" style="margin-top:var(--space-4)">아직 적은 항목이 없습니다. 아래에서 한 줄씩 더하세요.</p>`;

  return `<div class="card">
    <h2>원칙과 검토 질문 <span class="pill">${items.length}</span></h2>
    <div class="card-sub">정답은 없고, 우리도 답을 제안하지 않습니다.</div>
    ${migrated}${restored}${flashBox}
    <div class="q-note" style="margin-top:var(--space-4)">
      <b>★ 핵심</b>으로 표시한 항목은 의사결정 기록에서 답을 적어야 기록을 마칠 수 있습니다(지금 ${coreCount}개).
      나머지는 기록 화면에 나오되 비워 둘 수 있습니다. 항목을 지워도 그 항목에 답한 과거 기록은 지워지지 않습니다.
    </div>
    ${list}

    <div class="q">
      <label for="new-text">새 항목</label>
      <div class="kinds" role="group" aria-label="항목 종류">
        ${Object.entries(KINDS).map(([id, label]) =>
          `<button type="button" data-kind="${id}" aria-pressed="${newKind === id}" ${loadFailed ? "disabled" : ""}>${label}</button>`).join("")}
      </div>
      <div class="add-row">
        <input class="field" id="new-text" type="text" ${loadFailed ? "disabled" : ""}>
        <button type="button" class="btn" id="add" ${loadFailed ? "disabled" : ""}>＋ 추가</button>
      </div>
      <div class="q-note">원칙은 이렇게 한다·하지 않는다, 검토 질문은 스스로에게 던질 질문입니다. 기록 화면에서는 둘이 똑같이 나옵니다 — 구분은 이름표입니다.</div>
    </div>

    <div class="q" style="margin-top:var(--space-7)">
      <label for="reason">이번에 무엇을 바꿨고 왜 바꿨습니까?</label>
      <div class="add-row">
        <input class="field" id="reason" type="text" ${loadFailed ? "disabled" : ""}>
        <button type="button" class="btn" id="save" ${busy || loadFailed || !dirty ? "disabled" : ""}>저장</button>
      </div>
      <div class="q-note" data-save-note>${loadFailed
        ? "지금 저장하면 저장돼 있던 원칙이 빈 목록으로 덮일 수 있어 잠갔습니다. 불러오기가 된 뒤에 저장하세요."
        : dirty ? "저장하지 않은 변경이 있습니다. 이 기기에는 남아 있지만, 의사결정 기록에는 저장한 뒤부터 나옵니다."
        : "이유는 비워 두어도 저장됩니다. 적어 두면 나중에 원칙이 언제 왜 움직였는지 볼 수 있습니다."}</div>
    </div>
  </div>`;
}

// 이력은 해석하지 않고 그대로 보여준다. 예전 모양(질문 여섯)과 지금 모양(목록)을 둘 다 읽는다.
function revisionBody(answers) {
  if (answers && answers.version === JournalStore.PRINCIPLES_VERSION) {
    const docAt = JournalStore.normalizePrinciples(answers);
    if (!docAt.items.length) return "항목 없음";
    return `<ul>${docAt.items.map((item) =>
      `<li>${item.core ? "★ " : ""}<b>${escapeHtml(KINDS[item.kind])}</b> ${escapeHtml(item.text)}</li>`).join("")}</ul>`;
  }
  const lines = JournalStore.LEGACY_QUESTIONS
    .filter((q) => (answers || {})[q.id])
    .map((q) => `<div><b>${escapeHtml(q.text)}</b><br>${escapeHtml(answers[q.id])}</div>`)
    .join("");
  return lines || "내용 없음";
}

function historyCard() {
  if (!revisions.length) {
    return `<div class="card">
      <h2>바뀐 기록</h2>
      <p class="soon-body" style="margin-top:var(--space-3)">아직 저장한 원칙이 없습니다. 저장하면 그때부터 바뀐 기록이 쌓입니다.</p>
    </div>`;
  }
  const rows = revisions.map((rev) => `<div class="rev">
      <div class="rev-head">
        <span class="rev-when">${escapeHtml(String(rev.changed_at || "").slice(0, 10))}</span>
        <span class="rev-reason">${rev.reason ? escapeHtml(rev.reason) : "이유를 적지 않음"}</span>
      </div>
      <div class="rev-body">${revisionBody(rev.answers)}</div>
    </div>`).join("");
  return `<div class="card">
    <h2>바뀐 기록</h2>
    <div class="card-sub">${revisions.length}번 저장했습니다. 지우거나 고칠 수 없습니다.</div>
    <div style="margin-top:var(--space-4)">${rows}</div>
  </div>`;
}

function render() {
  if (!loaded) {
    Shell.mount("app", "philosophy", `${head()}<div class="card"><span class="skel" style="width:60%"></span></div>`, navOptions());
    return;
  }
  // 입력 중인 값을 다시 그리기 전에 붙잡는다. 새로 그리면 입력칸이 새로 만들어진다.
  const keep = {
    newText: document.getElementById("new-text")?.value ?? null,
    reason: document.getElementById("reason")?.value ?? null,
  };
  const problem = error
    ? `<div class="card"><h2>불러오지 못했어요 <span class="pill warn">확인 필요</span></h2>
       <p class="soon-body" style="margin-top:var(--space-3)">${escapeHtml(error)}</p></div>`
    : "";
  Shell.mount("app", "philosophy",
    `${head()}${problem}${listCard()}<div style="margin-top:var(--space-4)">${historyCard()}</div>`,
    navOptions());
  if (keep.newText !== null && document.getElementById("new-text")) document.getElementById("new-text").value = keep.newText;
  if (keep.reason !== null && document.getElementById("reason")) document.getElementById("reason").value = keep.reason;
  bind();
}

function itemById(id) {
  return items.find((item) => item.id === id) || null;
}

function bind() {
  document.querySelectorAll("button[data-kind]").forEach((node) => node.addEventListener("click", () => {
    newKind = node.dataset.kind;
    persistDraft();
    render();
  }));
  document.getElementById("add")?.addEventListener("click", onAdd);
  document.getElementById("new-text")?.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.isComposing) { event.preventDefault(); onAdd(); }
  });
  document.querySelectorAll("button[data-core]").forEach((node) => node.addEventListener("click", () => {
    const item = itemById(node.dataset.core);
    if (!item) return;
    item.core = !item.core;
    item.updatedAt = new Date().toISOString();
    flash = null;
    markChanged();
    render();
  }));
  document.querySelectorAll("button[data-edit]").forEach((node) => node.addEventListener("click", () => {
    editingId = node.dataset.edit;
    render();
    document.getElementById("edit-text")?.focus();
  }));
  document.querySelector("button[data-edit-cancel]")?.addEventListener("click", () => { editingId = null; render(); });
  document.querySelector("button[data-edit-ok]")?.addEventListener("click", (event) => {
    const item = itemById(event.currentTarget.dataset.editOk);
    const next = String(document.getElementById("edit-text")?.value || "").trim();
    if (item && next && next !== item.text) {
      const before = item.text;
      const n = answeredCount(item.id);
      item.text = next;
      item.updatedAt = new Date().toISOString();
      flash = { text: n
        ? `문구를 고쳤습니다. 이미 쓴 기록 ${n}건은 고치기 전 문구 "${escapeHtml(before)}"에 대한 답으로 남습니다.`
        : "문구를 고쳤습니다." };
      markChanged();
    }
    editingId = null;
    render();
  });
  document.querySelectorAll("button[data-delete]").forEach((node) => node.addEventListener("click", () => {
    const index = items.findIndex((item) => item.id === node.dataset.delete);
    if (index < 0) return;
    const [item] = items.splice(index, 1);
    const n = answeredCount(item.id);
    deleted = { item, index };
    // 지운다고 기록이 지워지지 않는다는 것을 그 자리에서 말한다. 저장하기 전까지는 되돌릴 수 있다.
    flash = {
      text: `"${escapeHtml(item.text)}"을(를) 목록에서 뺐습니다. ${n
        ? `이 항목에 답한 과거 기록 ${n}건은 지워지지 않고, 답할 당시의 문구와 함께 의사결정 기록의 지난 기록에 그대로 남습니다.`
        : "이 항목에 답한 기록은 없었습니다."} 저장해야 굳습니다.`,
      undo: true,
    };
    if (editingId === item.id) editingId = null;
    markChanged();
    render();
  }));
  document.querySelector("button[data-undo]")?.addEventListener("click", () => {
    if (deleted) items.splice(Math.min(deleted.index, items.length), 0, deleted.item);
    deleted = null;
    flash = null;
    markChanged();
    render();
  });
  ["new-text", "reason"].forEach((id) => document.getElementById(id)?.addEventListener("input", persistDraft));
  document.getElementById("save")?.addEventListener("click", onSave);
}

function onAdd() {
  if (loadFailed) return;
  const node = document.getElementById("new-text");
  const text = String(node?.value || "").trim();
  if (!text) { node?.focus(); return; }
  const now = new Date().toISOString();
  items.push({ id: JournalStore.newPrincipleId(), text, kind: newKind, core: false, origin: null, createdAt: now, updatedAt: now });
  node.value = "";
  flash = null;
  markChanged();
  render();
  document.getElementById("new-text")?.focus();
}

async function onSave() {
  // 화면만 잠그면 다른 경로로 불릴 때 뚫린다. 여기서 한 번 더 막는다.
  if (loadFailed) return;
  const reason = String(document.getElementById("reason")?.value || "").trim();
  busy = true;
  render();
  try {
    await JournalStore.savePrinciples({ items, migratedFrom: doc.migratedFrom }, reason);
    const current = await JournalStore.loadPhilosophy();
    doc = Object.assign({}, current.doc, { updatedAt: current.updatedAt });
    items = doc.items.map((item) => Object.assign({}, item));
    revisions = await JournalStore.loadRevisions();
    JournalStore.clearDraft("principles");
    dirty = false;
    restoredDraft = false;
    deleted = null;
    flash = { text: "저장했습니다. 의사결정 기록에 지금 목록이 나옵니다." };
    error = null;
    const reasonNode = document.getElementById("reason");
    if (reasonNode) reasonNode.value = "";
  } catch (problem) {
    error = problem.message || "저장하지 못했습니다.";
  } finally {
    busy = false;
    render();
  }
}

(async function () {
  render();
  if (!(await AccountStore.bootstrapProtected())) return;
  let restoreInputs = null;
  try {
    const current = await JournalStore.loadPhilosophy();
    doc = Object.assign({}, current.doc, { updatedAt: current.updatedAt });
    items = doc.items.map((item) => Object.assign({}, item));
    revisions = await JournalStore.loadRevisions();
    // 기록 수는 지우거나 고칠 때 무엇이 걸려 있는지 말하는 데만 쓴다. 못 읽어도 화면은 선다.
    try { records = await JournalStore.loadRecords({ limit: 500 }); } catch (problem) { records = []; }
    // 저장하지 않은 변경이 이 기기에 남아 있으면 되살린다. 새로 고침에서 잃지 않게 한다.
    const draft = JournalStore.loadDraft("principles");
    if (draft && draft.dirty && Array.isArray(draft.items)) {
      items = draft.items;
      newKind = draft.newKind || newKind;
      dirty = true;
      restoredDraft = true;
    }
    if (draft) restoreInputs = { newText: draft.newText || "", reason: draft.reason || "" };
    // 예전 여섯 질문의 답을 목록으로 옮긴 경우 — 저장하기 전까지는 서버 모양이 v1이다.
    if (doc.migrated) dirty = true;
  } catch (problem) {
    error = problem.message || "불러오지 못했습니다.";
    loadFailed = true;
  } finally {
    loaded = true;
    render();
    if (restoreInputs) {
      const newText = document.getElementById("new-text");
      const reason = document.getElementById("reason");
      if (newText && restoreInputs.newText) newText.value = restoreInputs.newText;
      if (reason && restoreInputs.reason) reason.value = restoreInputs.reason;
    }
  }
})();
</script>
