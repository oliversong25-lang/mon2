<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <title>내 자산</title>
  <!-- 폰트는 렌더를 막지 않게 받는다. 도착 전에는 폴백으로 읽히고 도착하면 바뀐다. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"

  <link rel="stylesheet" media="print" onload="this.media='all'"

  <script src="lib/supabase-config.js?v=20260811-1"></script>

  <script src="lib/auth-guard.js"></script>
  <style>
    /* 홈 화면 전용. 공통 토큰·셸·표는 lib/app.css에 있다. */

    /* 총자산은 이 화면의 표제다. 숫자는 명조로 조판하고, 억·만·원 단위 글자는 한 단계
       작게·흐리게 내려 앉힌다 — 자릿수를 세지 않아도 규모가 먼저 읽힌다.
       이 조판은 한국어 금액 표기에만 있는 것이라, 이 앱의 서명이 된다. */
    .total-amount { font-family:var(--font-display); font-size:var(--font-total); font-weight:600;
      letter-spacing:-.02em; line-height:1.15; }
    .total-amount .u { margin:0 .04em 0 .1em; color:var(--muted); font-size:.56em; font-style:normal;
      font-weight:500; letter-spacing:0; vertical-align:.1em; }
    .total-change { margin-top:var(--space-2); font-size:var(--font-sm); font-weight:700; }
    .total-change.flat { color:var(--muted); font-weight:600; }
    /* 전일 종가가 없어 변화 계산에서 빠진 자산. 조용히 0으로 넣지 않는다. */
    .change-note { margin-top:var(--space-1); color:var(--dim); font-size:var(--font-xs); line-height:1.5; }
    .split { margin-top:var(--space-5); padding-top:var(--space-4); border-top:var(--border) solid var(--line); }
    .split-row { display:flex; align-items:baseline; justify-content:space-between; gap:var(--space-2); font-size:var(--font-sm); }
    .split-row + .split-row { margin-top:var(--space-2); }
    .split-row .k { color:var(--muted); } .split-row .v { font-weight:700; }
    .split-row .s { min-width:3rem; color:var(--dim); font-size:var(--font-xs); text-align:right; }
    .excluded { margin-top:var(--space-4); padding:var(--space-3); border-radius:var(--radius-sm);
      background:var(--surface-2); color:var(--muted); font-size:var(--font-xs); line-height:1.6; }

    .check-line { margin-top:var(--space-4); padding-top:var(--space-3); border-top:var(--border) solid var(--line); }
    .check-head { margin-bottom:var(--space-2); color:var(--muted); font-size:var(--font-xs); font-weight:700; }
    .check-item { display:flex; width:100%; align-items:flex-start; gap:var(--space-2); padding:var(--space-2);
      border:0; border-radius:var(--radius-sm); background:transparent; color:inherit; text-align:left; font-size:var(--font-sm); }
    .check-item:hover { background:var(--surface-2); }
    .check-item .grow { flex:1; min-width:0; }
    .check-item .meta { display:block; margin-top:.125rem; color:var(--dim); font-size:var(--font-xs); line-height:1.5; }
    .soon-body { color:var(--dim); font-size:var(--font-sm); line-height:1.7; }
    .list-item { display:flex; width:100%; align-items:flex-start; gap:var(--space-3); padding:var(--space-3);
      border:0; border-radius:var(--radius-sm); background:transparent; color:inherit; text-align:left; font-size:var(--font-sm); }
    .list-item:hover { background:var(--surface-2); }
    .list-item + .list-item { margin-top:var(--space-1); }
    .list-item .idx { display:grid; width:1.25rem; height:1.25rem; flex:none; border-radius:50%;
      background:var(--surface-2); color:var(--muted); font-size:var(--font-xs); place-items:center; }
    .list-item .grow { flex:1; min-width:0; }
    .list-item .meta { display:block; margin-top:var(--space-1); color:var(--dim); font-size:var(--font-xs); line-height:1.5; }
    .list-item .when { flex:none; color:var(--brand-ink); font-size:var(--font-xs); font-weight:700; }

    .chart-head { display:flex; align-items:flex-start; justify-content:space-between; gap:var(--space-4); margin-bottom:var(--space-4); }
    .chart-head > div:first-child { min-width:0; }
    .chart-head .toolbar { flex:none; }
    .toolbar { display:flex; align-items:center; gap:var(--space-2); }

    /* 도넛으로 복귀. 예전에 막대로 바꾼 이유는 부동산이 91%를 차지해 나머지가 실 가닥으로
       뭉쳤던 것인데, 금융자산·실물자산을 나눈 뒤로는 금융자산 안에서 고르게 분포한다.
       조각 색이 초록 계열 그라데이션이라 구분되지 않았던 문제는 팔레트로 해결했다. */
    .donut-wrap { display:flex; flex-direction:column; align-items:center; gap:var(--space-2); }
    .donut { display:block; max-width:11.5rem; }
    .donut-seg { cursor:pointer; transition:opacity .15s var(--ease); }
    .donut-seg:hover { opacity:.75; }
    .donut-center-label { fill:var(--dim); font-size:.5rem; }
    .donut-center-value { fill:var(--ink); font-size:.75rem; font-weight:800; }
    .stackbar-note { margin-top:var(--space-1); color:var(--dim); font-size:var(--font-xs); }
    .legend { width:100%; margin-top:var(--space-2); }
    /* 범례가 진입점이므로 터치·클릭 타겟을 충분히 준다(44px 이상). */
    .legend-row { display:grid; width:100%; min-height:2.75rem; grid-template-columns:auto 1fr auto auto;
      align-items:center; gap:var(--space-3); padding:var(--space-2) var(--space-3); border:0;
      border-radius:var(--radius-sm); background:transparent; color:inherit; text-align:left; font-size:var(--font-sm); }
    .legend-row:hover { background:var(--surface-2); }
    .swatch { width:.625rem; height:.625rem; flex:none; border-radius:.1875rem; }
    .legend-row .name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .legend-row .share { min-width:3.25rem; font-weight:700; text-align:right; }
    .legend-row .amount { min-width:7.5rem; color:var(--muted); text-align:right; }

    .meter + .meter { margin-top:var(--space-5); }
    .meter-head { display:flex; justify-content:space-between; margin-bottom:var(--space-2); font-size:var(--font-sm); }
    .meter-head .val { color:var(--muted); }
    /* 위치만 찍는다 — 채운 막대는 "많이 채울수록 좋다"로 읽힌다. */
    .meter-track { position:relative; height:.375rem; border-radius:var(--radius-round); background:var(--surface-2); }
    .meter-track::before { content:""; position:absolute; top:-.25rem; bottom:-.25rem; left:50%; width:var(--border); background:var(--line); }
    .meter-fill { position:absolute; top:0; bottom:0; border-radius:var(--radius-round); background:#7b8bb0; }
    .meter-mark { position:absolute; top:50%; width:.75rem; height:.75rem; margin:-.375rem 0 0 -.375rem;
      border:.125rem solid var(--surface); border-radius:50%; background:#aab6d0; }
    .meter-scale { display:flex; justify-content:space-between; margin-top:var(--space-1); color:var(--dim); font-size:var(--font-xs); }
    .summary-text { margin-bottom:var(--space-5); font-size:var(--font-sm); line-height:1.7; }

    .chart { display:block; width:100%; height:13rem; }
    .chart-note { margin-top:var(--space-2); color:var(--dim); font-size:var(--font-xs); }

    /* 상위 4행 높이로 고정한다. 헤더(약 2.4rem) + 행 4개(약 3.4rem) 기준.
       카드 높이가 자산 수에 따라 늘어나면 홈 전체가 끝없이 길어진다. */
    /* 열이 8개인 표는 페이지가 아니라 자기 안에서 가로로 스크롤한다. */
    .holdings-scroll { overflow-x:auto; }
    .holdings-scroll.capped { max-height:16rem; overflow-y:auto; overscroll-behavior:contain; }
    /* 스크롤해도 어떤 열인지 보이도록 머리글을 붙여 둔다. */
    .holdings-scroll.capped thead th { position:sticky; top:0; z-index:1; background:var(--surface); }
    .pl-strip { display:flex; flex-wrap:wrap; gap:var(--space-6); margin-bottom:var(--space-4);
      padding:var(--space-4); border-radius:var(--radius-md); background:var(--surface-2); }
    .pl-block .pl-label { color:var(--muted); font-size:var(--font-xs); }
    .pl-block .pl-value { margin:var(--space-1) 0; font-size:var(--font-lg); font-weight:800; }
    .pl-block .pl-basis { color:var(--dim); font-size:var(--font-xs); line-height:1.5; }

    /* 목록은 카드 안에서만 스크롤한다. 상단 3열 행의 높이를 이 카드가 끌어올리면
       안 되므로(총자산 카드가 행 높이를 정한다) 높이를 명시적으로 묶는다.
       아코디언·접기 토글은 쓰지 않는다 — 목록 자체가 접히면 무엇이 다가오는지
       한눈에 보이지 않는다. */
    .schedule-scroll { max-height:6.75rem; overflow-y:auto; overscroll-behavior:contain; }
    .sched-item + .sched-item { margin-top:var(--space-1); }

    /* 보기 방식·필터 전환. 카드 안에서는 한 줄을 넘기면 안 되므로 아주 작게 둔다. */
    .seg { display:inline-flex; overflow:hidden; border:var(--border) solid var(--line); border-radius:var(--radius-round); }
    .seg-btn { padding:.125rem var(--space-2); border:0; background:transparent; color:var(--muted);
      font-size:var(--font-xs); line-height:1.6; white-space:nowrap; }
    .seg-btn:hover { background:var(--surface-2); color:var(--ink); }
    .seg-btn.on { background:var(--brand-soft); color:var(--brand-ink); font-weight:700; }
    .sched-modes { margin-bottom:var(--space-2); }
    .sched-controls { display:flex; flex-wrap:wrap; gap:var(--space-2); margin-bottom:var(--space-4); }

    /* 주·월 묶음 머리글. 스크롤해도 어느 묶음을 보고 있는지 보이도록 붙여 둔다. */
    .sched-group + .sched-group { margin-top:var(--space-2); }
    .sched-group-head { position:sticky; top:0; z-index:1; display:flex; justify-content:space-between;
      padding:var(--space-1) var(--space-2); background:var(--surface); color:var(--muted);
      font-size:var(--font-xs); font-weight:700; }
    .sched-group-count { color:var(--dim); font-weight:400; }
    /* 확정 공표일이 아니라 규칙으로 잡은 예정일 */
    .sched-approx { margin-left:var(--space-1); padding:0 .25rem; border-radius:var(--radius-sm);
      background:var(--surface-2); color:var(--dim); font-size:var(--font-xs); }
    /* 중요도 높은 일정만 왼쪽에 표시를 준다. 색은 손익에만 쓰므로 여기서는 밝기로만 나눈다. */
    .sched-item.high .sched-head { box-shadow:inset 2px 0 0 var(--brand); }
    .sched-head { display:flex; width:100%; align-items:center; gap:var(--space-3); padding:var(--space-2);
      border:0; border-radius:var(--radius-sm); background:transparent; color:inherit; text-align:left; font-size:var(--font-sm); }
    .sched-head:hover { background:var(--surface-2); }
    .sched-item.open .sched-head { background:var(--surface-2); }
    .sched-dday { min-width:3.25rem; flex:none; color:var(--brand-ink); font-size:var(--font-xs); font-weight:800; font-variant-numeric:tabular-nums; }
    .sched-main { flex:1; min-width:0; }
    .sched-title { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .sched-when { display:block; margin-top:.125rem; color:var(--dim); font-size:var(--font-xs); }
    .sched-org { flex:none; padding:.125rem var(--space-2); border-radius:var(--radius-round);
      background:var(--surface-2); color:var(--muted); font-size:var(--font-xs); }
    .sched-body { padding:var(--space-2) var(--space-2) var(--space-3); }
    .scenario + .scenario { margin-top:var(--space-3); }
    .scenario b { display:block; margin-bottom:var(--space-1); color:var(--ink); font-size:var(--font-xs); }
    .scenario p { color:var(--muted); font-size:var(--font-xs); line-height:1.7; }
    .scenario-note { margin-top:var(--space-3); color:var(--dim); font-size:var(--font-xs); line-height:1.6; }
    .pill.warn { background:var(--brand-soft); color:var(--brand-ink); }

    /* 확대 보기 */
    .overlay { position:fixed; z-index:2000; inset:0; display:grid; padding:var(--space-6);
      background:rgba(0,0,0,.55); place-items:center; }
    .overlay-panel { display:flex; width:min(46rem,100%); max-height:min(40rem,86vh); flex-direction:column;
      padding:var(--space-6); border:var(--border) solid var(--line); border-radius:var(--radius-lg);
      background:var(--surface); box-shadow:var(--shadow); }
    .overlay-head { display:flex; align-items:flex-start; justify-content:space-between; gap:var(--space-4); margin-bottom:var(--space-4); }
    .overlay-body { min-height:0; flex:1; overflow-y:auto; }
    .overlay-body .sched-when { white-space:normal; }

    .ind-rows { display:grid; gap:var(--space-2); }
    .ind-row { display:grid; grid-template-columns:1fr auto; align-items:baseline; gap:var(--space-2) var(--space-3); }
    .ind-row-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:var(--font-sm); }
    .ind-row-value { font-weight:800; font-variant-numeric:tabular-nums; }
    /* 관측 기간은 값과 반드시 함께 나간다 — 몇 달 전 값도 그 시점의 정상 데이터다. */
    .ind-row-period { grid-column:1 / -1; margin-top:-.125rem; color:var(--dim); font-size:var(--font-xs); }
    .soon-card { padding:var(--space-5); border:var(--border) dashed var(--line);
      border-radius:var(--radius-lg); background:var(--surface); }
    .soon-card b { display:block; margin:var(--space-2) 0 var(--space-1); font-size:var(--font-md); }
    .soon-card span { color:var(--dim); font-size:var(--font-xs); }
    .sources { margin-top:var(--space-6); color:var(--dim); font-size:var(--font-xs); line-height:1.8; }
  </style>

<body>
<div id="app"></div>
<script src="lib/fetch-data.js?v=20260815-1"></script>
<script src="lib/session.js"></script>
<script src="lib/valuation.js"></script>
<script src="lib/portfolio.js"></script>
<script src="lib/shell.js?v=20260813-1"></script>
<script src="lib/format.js"></script>
<script src="lib/indicators-view.js"></script>
<script>
// 홈 화면. 금액 계산은 lib/valuation.js, 집계·분류는 lib/portfolio.js, 세션 읽기는
// lib/session.js가 담당한다. 이 파일은 그 결과를 그리기만 한다 — 여기서 평가금액을
// 다시 계산하지 말 것.
const INPUT_URL="asset-input.html";
const ASSETS_URL="assets.html";
const INDICATORS_URL="indicators.html";
const { won, pct, escapeHtml, daysBetween } = Format;

let sessionState=SessionStore.read();
let session=toSession(sessionState);
let axis="group";
let assetClass="financial";
// 보유 자산 카드에 한 번에 보일 행 수. 나머지는 카드 안에서 스크롤한다.
const VISIBLE_HOLDINGS=4;

// 내비의 자산군 건수는 어떤 화면 상태에서도 같아야 한다 — 로딩 중이나 빈 상태에서
// 0으로 보이면 자산이 사라진 것처럼 읽힌다.
function navOptions(){return {assetCounts:Shell.countByGroup(session.assets||[])};}

function toSession(state){
  const raw=SessionStore.readRaw()||{};
  return {schema:SessionStore.SCHEMA,assets:state.assets,snapshots:Array.isArray(raw.snapshots)?raw.snapshots:[],skippedGroups:Array.isArray(raw.skippedGroups)?raw.skippedGroups:[]};
}
// 예전 형식(스키마 불일치)에서 읽어온 세션은 절대 덮어쓰지 않는다 — 저장하는 순간
// 원본이 현재 스키마로 대체돼 되돌릴 수 없다. 스냅샷 몇 건보다 원본 보존이 우선이다.
function saveSession(){
  if(sessionState.status!=="ok")return;
  SessionStore.write(Object.assign({},SessionStore.readRaw(),session));
}

// 스냅샷은 asOf(시세 기준일)가 바뀐 걸 감지한 첫 실행에만 쌓는다. 앱을 연 시각을
// 기준으로 하면 하루에 여러 번 열 때 중복되고 며칠 안 열면 구멍이 생긴다.
function recordSnapshot(total){
  const date=Valuation.asOfDate();
  if(!date||!Number.isFinite(total))return;
  const last=session.snapshots[session.snapshots.length-1];
  if(last&&last.date===date){if(last.total!==total){last.total=total;saveSession();}return;}
  session.snapshots.push({date,total});
  saveSession();
}

// 범주를 구분하기 위한 색이지 좋고 나쁨을 뜻하지 않는다. 빨강·초록을 뺀 이유가 그것이다
// (손익에만 색을 쓰기로 했는데, 구성 그래프에 빨강·초록이 있으면 비중이 큰 게 좋거나
// 나쁜 것처럼 읽힌다). 이 순서는 다크 표면(#141b2b) 기준으로 색각 이상 시뮬레이션을
// 포함한 검증을 통과했다 — 인접쌍 최저 CVD ΔE 8.4, 일반 시야 최저 19.3, 대비 전부 3:1 이상.
// 순서나 색을 바꾸면 다시 검증할 것.
const SERIES_COLORS=["#3987e5","#d95926","#199e70","#c98500","#d55181","#9085e9"];

// 도넛. 조각도 진입점이지만 작은 조각은 누르기 어려우므로 범례 행이 주 진입점이다.
function donut(parts,centerLabel,centerValue){
  if(!parts.length)return"";
  const size=184,stroke=30,radius=(size-stroke)/2,circumference=2*Math.PI*radius;
  let offset=0;
  const segments=parts.map((part,index)=>{
    const length=circumference*part.share;
    // 조각 사이에 표면색 간격을 둬 인접한 색이 서로 번지지 않게 한다.
    const gap=parts.length>1?Math.min(2,length):0;
    const ring=`<circle class="donut-seg" data-slice="${escapeHtml(part.label)}" r="${radius}" cx="${size/2}" cy="${size/2}"
      fill="none" stroke="${SERIES_COLORS[index%SERIES_COLORS.length]}" stroke-width="${stroke}"
      stroke-dasharray="${Math.max(length-gap,0.5)} ${circumference-Math.max(length-gap,0.5)}"
      stroke-dashoffset="${-offset}" transform="rotate(-90 ${size/2} ${size/2})"
      role="button" tabindex="0"><title>${escapeHtml(part.label)} ${pct(part.share)}</title></circle>`;
    offset+=length;
    return ring;
  }).join("");
  return `<svg class="donut" viewBox="0 0 ${size} ${size}" role="img" aria-label="${escapeHtml(parts.map(part=>`${part.label} ${pct(part.share)}`).join(", "))}">
    ${segments}
    <text class="donut-center-label" x="${size/2}" y="${size/2-6}" text-anchor="middle">${escapeHtml(centerLabel)}</text>
    <text class="donut-center-value" x="${size/2}" y="${size/2+10}" text-anchor="middle">${escapeHtml(centerValue)}</text>
  </svg>`;
}

function legend(parts){
  return `<div class="legend">${parts.map((part,index)=>`
    <button type="button" class="legend-row" data-slice="${escapeHtml(part.label)}">
      <span class="swatch" style="background:${SERIES_COLORS[index%SERIES_COLORS.length]}"></span>
      <span class="name">${escapeHtml(part.label)}</span>
      <span class="share num">${pct(part.share)}</span>
      <span class="amount num">${won(part.krw)}</span>
    </button>`).join("")}</div>`;
}

// 중앙(50%)에서 값까지만 채운다. 왼쪽 끝부터 채우면 "가득 채울수록 좋다"로 읽히는데
// 이 축들은 점수가 아니다 — 집중도가 높은 것도, 원금 보장 비중이 낮은 것도 나쁜 게 아니다.
// 중앙 기준이면 선이라 잘 보이면서도 방향(어느 쪽으로 치우쳤는지)만 드러난다.
function meterRow(meter){
  const value=Math.max(0,Math.min(1,meter.value));
  const left=Math.min(value,0.5)*100;
  const width=Math.abs(value-0.5)*100;
  return `<div class="meter">
    <div class="meter-head"><span>${meter.label}</span><span class="val num">${pct(value,0)}</span></div>
    <div class="meter-track">
      <span class="meter-fill" style="left:${left}%; width:${width}%"></span>
      <span class="meter-mark" style="left:${value*100}%"></span>
    </div>
    <div class="meter-scale"><span>낮음</span><span>높음</span></div>
  </div>`;
}

function trendChart(snapshots){
  if(snapshots.length<2)return"";
  const width=1000,height=200,padding=16;
  const totals=snapshots.map(point=>point.total);
  const min=Math.min(...totals),max=Math.max(...totals),span=max-min||1;
  const start=new Date(snapshots[0].date);
  const spanDays=Math.max(1,daysBetween(start,new Date(snapshots[snapshots.length-1].date)));
  const at=point=>({
    x:padding+(daysBetween(start,new Date(point.date))/spanDays)*(width-padding*2),
    y:padding+(1-(point.total-min)/span)*(height-padding*2),
  });
  // 기록이 없는 날짜 구간을 직선으로 이으면 그 기간에 자산이 매끄럽게 변한 것처럼
  // 보인다. 사실이 아니므로 하루 이상 벌어진 구간은 점선으로 끊어 그린다.
  let gapDays=0;
  const segments=snapshots.slice(1).map((point,index)=>{
    const previous=snapshots[index],gap=daysBetween(previous.date,point.date);
    if(gap>1)gapDays+=gap-1;
    const from=at(previous),to=at(point);
    return `<line x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}" stroke="var(--brand)" stroke-width="2" stroke-linecap="round"${gap>1?' stroke-dasharray="4 4" opacity=".55"':""} />`;
  }).join("");
  const dots=snapshots.map(point=>{const spot=at(point);return `<circle cx="${spot.x}" cy="${spot.y}" r="3" fill="var(--brand)"><title>${point.date} ${won(point.total)}</title></circle>`;}).join("");
  return `<svg class="chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-label="자산 추이">${segments}${dots}</svg>
    ${gapDays?`<div class="chart-note">${gapDays}일치 기록이 비어 있어요 · 그 구간은 점선입니다</div>`:""}`;
}

// 시세가 낡아 보일 때, 그게 배치가 멈춘 것인지 이 브라우저가 옛 사본을 들고 있는
// 것인지 구별해 말한다. 둘은 원인도 대처도 다른데 화면에는 똑같이 보인다 —
// 실제로 그 구별이 안 돼 파이프라인 쪽을 며칠 뒤졌다.
function cacheNotice(){
  const info=Valuation.loadInfo&&Valuation.loadInfo();
  if(!info||!info.known||!info.fromCache)return null;
  const asOf=Valuation.asOfDate();
  if(!asOf)return null;
  const days=daysBetween(asOf,kstToday());
  if(days<2)return null;   // 주말·공휴일이면 이틀은 정상이다
  return {
    text:`시세가 ${asOf} 기준이고, 이 값은 서버가 아니라 브라우저 캐시에서 나왔어요`,
    meta:"새로고침해도 같으면 배치 쪽 문제입니다. 바뀌면 캐시 문제였습니다",
  };
}

function checkItems(summary){
  const items=[];
  const cached=cacheNotice();
  if(cached)items.push(cached);
  // 날짜가 섞인 데이터를 한 시점의 스냅샷인 것처럼 보여주지 않는다. 코인게코가 실패한
  // 날 배치는 국내 시세만 갱신하고 코인 값은 직전 것을 들고 가는데, 그 사실을 밝히지
  // 않으면 화면의 모든 숫자가 같은 날 기준인 것처럼 읽힌다.
  const staleCrypto=Valuation.staleCryptoDate&&Valuation.staleCryptoDate();
  if(staleCrypto&&(session.assets||[]).some(asset=>asset.group==="crypto")){
    const days=daysBetween(staleCrypto,Valuation.asOfDate());
    items.push({text:`가상자산 시세가 ${staleCrypto} 기준이에요 (나머지보다 ${days}일 이전)`,meta:"코인게코 갱신에 실패해 직전 값을 그대로 쓰고 있어요. 국내 시세는 정상 갱신됐습니다"});
  }
  if(summary.unavailable.length)items.push({text:`시세를 확인하지 못한 자산 ${summary.unavailable.length}건`,meta:summary.unavailable.map(entry=>entry.name).join(", ")});
  if(summary.noPurchaseCount)items.push({text:`매입 정보가 없어 손익 계산에서 빠진 자산 ${summary.noPurchaseCount}건`,meta:"매입금액을 입력하면 평가손익에 포함됩니다"});
  const soon=maturingSoon(90);
  if(soon.length)items.push({text:`만기가 90일 이내인 자산 ${soon.length}건`,meta:soon.map(entry=>entry.name).join(", ")});
  const skipped=(session.skippedGroups||[]).length;
  if(skipped)items.push({text:`아직 입력하지 않은 자산군 ${skipped}개`,meta:(session.skippedGroups||[]).map(id=>Portfolio.GROUP_NAMES[id]||id).join(", ")});
  return items;
}

function maturingSoon(days){
  const today=Valuation.asOfDate()||new Date().toISOString().slice(0,10);
  return (session.assets||[]).map(asset=>{
    const raw=asset.fields.maturityDate||(asset.group==="bond"?(asset.autoFields||{}).maturity:null);
    if(!raw)return null;
    const date=String(raw).length===7?`${raw}-01`:String(raw);
    const left=daysBetween(today,date);
    if(!Number.isFinite(left)||left<0||left>days)return null;
    return {name:Portfolio.assetName(asset),date,left};
  }).filter(Boolean).sort((a,b)=>a.left-b.left);
}

function sourcesLine(){
  const sources=Valuation.state.sources||{};
  const names=[...new Set(Object.values(sources).filter(Boolean))];
  if(!names.length)return"";
  const oecd=Indicators.state.status==="ready"?`<br>${escapeHtml(Indicators.attribution())}`:"";
  return `<div class="sources">출처: ${escapeHtml(names.join(" · "))}${oecd}
    ${sources.crypto?"<br>Data provided by CoinGecko · 가상자산은 국제 시세 기준이라 국내 거래소 체결가와 다를 수 있어요":""}</div>`;
}

function render(){

  // 자산이 0건인 것과, 예전 형식이라 못 읽는 것은 전혀 다른 사건이다. 같은 화면으로
  // 뭉뚱그리면 자산 20건을 입력해 둔 사용자가 "자산이 없어요"를 보게 된다.

  // 같은 일을 하는 버튼이 화면마다 다른 이름을 달면 그때마다 다시 읽어야 한다.

  if(Valuation.state.status==="error"){

  // 로드 후 다시 그려서, 환율이 없는 동안 외화가 빠진 총자산(실측 3,516만원 차이)이
  // 잠깐 보였다가 정정됐다. 게다가 "시세를 확인하지 못했어요"라는 사실 아닌 경고가
  // 떴다 사라졌는데, 그 문구는 정말로 시세를 못 받았을 때의 신뢰 장치라 그렇게 닳으면 안 된다.

}

function pageHead(){
  return `<div class="page-head">
    <div><h1>내 자산</h1></div>

  </div>${rail()}`;

// 기준일 레일. 이 화면을 지배하는 날짜를 왼쪽 끝에 두고, 기준일이 다른 값이 있으면
// 눈금으로 찍는다. 앱은 이미 날짜가 섞인 데이터를 한 시점의 스냅샷처럼 보여주지 않는데,
// 그 규칙을 문장이 아니라 구조로 드러내는 줄이다.
//
// 여기 찍히는 것은 경고가 아니다. 3개월 전 관측은 낡은 값이 아니라 그 시점의 값이고,
// 그 사실을 읽을 수 있게 만드는 것이 이 줄의 일이다. 정말로 갱신이 필요한 상태는
// 각 카드가 따로 말한다.
function rail(){
  const status=Valuation.state.status;
  const date=Valuation.asOfDate();
  const anchor=status==="loading"
    ?`<b>기준일 확인 중</b>`
    :date?`<b>${escapeHtml(date)}</b><span>종가 기준</span>`:`<b>기준일 없음</b><span>시세 파일을 확인하세요</span>`;

  const marks=[];
  const crypto=status==="ready"?Valuation.staleCryptoDate():null;
  if(crypto)marks.push(["가상자산",crypto]);
  const indicators=Indicators.staleness?.();
  if(indicators?.newest)marks.push(["경제지표",indicators.newest]);

  return `<div class="rail">
    <div class="rail-anchor stamp">${anchor}</div>
    <div class="rail-marks">${marks.map(([label,when])=>
      `<span class="rail-mark"><b>${escapeHtml(label)}</b><span class="stamp">${escapeHtml(when)}</span></span>`).join("")}</div>
  </div>`;
}

// 억·만·원 단위 글자를 감싸 조판을 나눈다. 숫자는 명조, 단위는 한 단계 작게 내려앉는다.
function amountHtml(value){
  return escapeHtml(won(value)).replace(/[억만원]+/g,unit=>`<i class="u">${unit}</i>`);
}

// 카드 골격만 띄우고 금액 자리는 비워 둔다. 레이아웃이 튀지 않게 같은 격자를 쓴다.
function skeleton(){
  const bar=(width)=>`<span class="skel" style="width:${width}"></span>`;
  const card=(title,body)=>`<div class="card"><h2>${title}</h2><div style="margin-top:var(--space-4)">${body}</div></div>`;
  return [
    pageHead(),
    `<div class="grid grid-top">
      ${card("총자산",`${bar("60%")}${bar("40%")}`)}
      ${newsCard()}
      ${scheduleCard()}
    </div>`,
    `<div class="grid grid-mid" style="margin-top:var(--space-4)">
      ${card("자산 구성",`${bar("100%")}${bar("70%")}${bar("60%")}`)}
      ${indicatorCard()}
      ${card("포트폴리오 요약",`${bar("85%")}${bar("60%")}${bar("60%")}`)}
    </div>`,
    `<div style="margin-top:var(--space-4)">${card("보유 자산",`${bar("100%")}${bar("100%")}${bar("80%")}`)}</div>`,
  ].join("");
}

function legacyBanner(){
  if(sessionState.status!=="migrated")return"";
  return `<div class="banner">예전 형식(v${escapeHtml(String(sessionState.schema ?? "?"))})으로 저장된 기록에서 자산 ${sessionState.assets.length}건을 불러왔어요. 원본은 지우지 않고 그대로 두었고, 이 화면에서는 새 기록(추이 등)을 저장하지 않습니다.</div>`;
}

// 총자산 변화. 기준선을 방문 이력이 아니라 시세 데이터에서 뽑는다.
//
// 예전에는 이 브라우저가 마지막으로 본 스냅샷과 비교했다. 그러면 두 가지가 섞인다.
// 며칠 만에 열면 며칠치 변화가 나오고(배포가 막혀 asOf가 08-07에 멈춰 있던 엿새 뒤
// 08-12로 뛰자 "8월 7일 대비"가 찍혔다), 자산을 하나 추가하면 그 금액이 통째로
// 변동으로 잡혔다(예금 5,000만원을 넣으면 5,000만원이 오른 것처럼 보인다).
//
// 지금은 **지금 들고 있는 자산을 전일 종가로 다시 평가**해 그 차이를 낸다. 자산을
// 더하거나 빼면 양쪽이 같이 움직이므로 변동으로 잡히지 않고, 남는 것은 가격뿐이다.
// 전일 값이 없는 자산은 0으로 때우지 않고 빼고, 몇 건을 뺐는지 화면에 적는다.
const PRICED_GROUPS=["equity","crypto","commodity"];

// 비교 시점을 어떻게 적을지.
//
// 카드에 날짜가 이것 하나뿐이면 "8월 12일 대비"가 "이 데이터는 8월 12일 것"으로 읽힌다.
// 실제로 그 오해가 파이프라인이 멈췄다는 신고로 여러 번 돌아왔다. 국내 증권사들은
// 기준일을 크게 앞세우고 변화는 날짜 없이 "전일 대비"로만 적어 이 문제를 피한다.
//
// 그래서 기본은 날짜 없는 "전일 대비"다. 기준선이 **직전 거래일이 아닐 때만** 날짜를
// 적는다 — 연휴 뒤처럼 그때는 날짜가 정보를 갖는다. 주말은 정상이므로 적지 않는다.
function changeLabel(prevDate){
  const asOf=Valuation.asOfDate();
  if(!prevDate||!asOf)return "직전 거래일 대비";
  // 두 날짜 사이에 낀 평일 수. 0이면 주말만 건너뛴 것이라 직전 거래일이 맞다.
  let weekdays=0;
  for(let probe=addDays(prevDate,1);probe<asOf;probe=addDays(probe,1)){
    const day=new Date(`${probe}T00:00:00Z`).getUTCDay();
    if(day!==0&&day!==6)weekdays+=1;
  }
  return weekdays?`${prevDate} 대비`:"전일 대비";
}

function addDays(date,delta){
  const ms=Date.parse(`${date}T00:00:00Z`)+delta*86400000;
  return new Date(ms).toISOString().slice(0,10);
}

function dayChange(assets){
  let current=0,previous=0,included=0,priced=0;
  const excluded=[];
  (assets||[]).forEach(asset=>{
    const now=Valuation.valuate(asset);
    const then=Valuation.valuatePrevious(asset);
    if(now.unavailable||then.unavailable){
      excluded.push({name:Portfolio.assetName(asset),reason:then.unavailable?then.reason:now.reason});
      return;
    }
    current+=now.krw;previous+=then.krw;included+=1;
    // 시세로 움직이는 자산이 하나도 안 들어오면 차이는 언제나 0이다. 그 0을
    // "변동 없음"으로 내보내면 모르는 것을 아는 것처럼 보여주는 셈이다.
    if(PRICED_GROUPS.includes(asset.group))priced+=1;
  });
  if(!included)return null;
  return {delta:current-previous,previous,included,priced,excluded,date:Valuation.prevCloseDate()};
}

function totalCard(summary){
  const move=dayChange(session.assets);
  let change=`<div class="total-change flat">전일 종가와 비교할 수 있는 자산이 없어요</div>`;
  if(move&&!move.priced){
    // 시세가 붙는 자산이 전부 빠졌다. 0원이라고 적으면 "그대로였다"로 읽힌다.
    change=`<div class="total-change flat">시세가 붙는 자산의 전일 종가가 없어 변화를 계산하지 못했어요</div>
      ${move.excluded.length?`<div class="change-note">${escapeHtml(move.excluded.slice(0,3).map(entry=>`${entry.name}(${entry.reason})`).join(", "))}${move.excluded.length>3?" 외":""}</div>`:""}`;
  }else if(move){
    const rate=move.previous?move.delta/move.previous:0;
    const tone=move.delta>0?"pos":move.delta<0?"neg":"flat";
    const mark=move.delta>0?"+":move.delta<0?"−":"";
    const when=changeLabel(move.date);
    const skipped=move.excluded.length
      ?` · 전일 종가가 없는 ${move.excluded.length}건 제외`
      :"";
    // 가상자산은 거래소 종가가 아니라 24시간 전과 비교한다. 기준 시점이 달라 밝혀 둔다.
    const cryptoBasis=(session.assets||[]).some(asset=>asset.group==="crypto"&&!Valuation.valuatePrevious(asset).unavailable)
      ?"가상자산은 24시간 전 대비"
      :"";
    change=`<div class="total-change ${tone} num">${mark}${won(Math.abs(move.delta))} (${mark}${pct(Math.abs(rate))}) · ${escapeHtml(when)}</div>
      ${skipped||cryptoBasis?`<div class="change-note">${[
        skipped?`${escapeHtml(skipped.replace(/^ · /,""))} · ${escapeHtml(move.excluded.slice(0,3).map(entry=>entry.name).join(", "))}${move.excluded.length>3?" 외":""}`:"",
        cryptoBasis,
      ].filter(Boolean).join(" · ")}</div>`:""}`;
  }
  const excluded=summary.unavailable.length
    ?`<div class="excluded">시세를 확인하지 못한 자산 ${summary.unavailable.length}건은 총자산에서 제외했어요 · ${escapeHtml(summary.unavailable.map(entry=>entry.name).join(", "))}</div>`:"";
  // 부동산 하나가 90%를 넘으면 총액만으로는 나머지가 얼마인지 감이 오지 않는다.
  const split=summary.total?`<div class="split">
    <div class="split-row"><span class="k">금융자산</span><span class="v num">${won(summary.financial.total)}</span><span class="s num">${pct(summary.financial.share,0)}</span></div>
    <div class="split-row"><span class="k">실물자산</span><span class="v num">${won(summary.physical.total)}</span><span class="s num">${pct(summary.physical.share,0)}</span></div>
  </div>`:"";
  return `<div class="card">
    <h2>총자산</h2>
    <div class="total-amount num">${amountHtml(summary.total)}</div>
    ${change}${excluded}${split}${checkLine(summary)}
  </div>`;
}

// 카드 하나를 통째로 쓰지 않고 총자산 카드 아래 한 줄로 붙인다. 다만 내용을 없애지는
// 않는다 — 이 줄은 "시세 확인 불가 N건", "매입 정보가 없어 손익에서 빠진 N건"처럼
// 화면의 숫자가 왜 불완전한지 설명하는 신뢰 장치다. 사라지면 총자산이 왜 어긋나는지
// 알 방법이 없어진다. 항목이 없을 때만 줄 자체를 숨긴다.
function checkLine(summary){
  const items=checkItems(summary);
  if(!items.length)return"";
  return `<div class="check-line">
    <div class="check-head">확인이 필요한 항목 <span class="pill">${items.length}</span></div>
    ${items.map(item=>`<button type="button" class="check-item" data-go="input">
      <span class="grow">${escapeHtml(item.text)}<span class="meta">${escapeHtml(item.meta)}</span></span><span>›</span>
    </button>`).join("")}
  </div>`;
}

// 이 카드의 용도는 자산 만기가 아니라 거시 경제 일정이다 — FOMC 금리 결정, 금통위
// 기준금리 결정. 자산 만기는 위의 '확인이 필요한 항목' 줄이 맡는다. 그 경계를 지킬 것.
//
// API가 없다. FOMC와 금통위 일정은 1년 이상 앞서 공표되므로 정적 파일이 맞는 출처다.
// 대신 그 파일은 언젠가 반드시 만료되므로, 만료를 조용히 넘기지 않는 것이 이 카드의
// 핵심 조건이다(아래 expiredCard 참조).
const MACRO_URL="data/macro-calendar.json";
let macro={status:"loading",data:null};
let openEventId=null;   // 시나리오를 펼친 일정
let scheduleExpanded=false; // 더보기로 연 확대 보기
// 보기 방식과 필터는 모듈 스코프에 둔다. 확대 보기를 열고 닫거나 일정을 펼쳤다 접어도
// 매번 render()가 다시 그리므로, 여기 없으면 고른 조건이 그때마다 초기화된다.
let scheduleMode="near";       // near | week | month
let scheduleCountry="all";     // all | KOR | USA
let scheduleImportance="all";  // all | high | medium

function loadMacroCalendar(){
  // 손으로 유지하는 파일이지만 갱신하면 바로 보여야 한다. 48KB라 조건부 요청이 싸다.
  return DataFetch.json(MACRO_URL,{fresh:true})
    .then(payload=>{macro={status:"ready",data:payload};})
    .catch(error=>{console.error("[경제 일정] 달력 로드 실패:",error);macro={status:"error",data:null};});
}

// 오늘(KST). 브라우저가 어느 시간대에 있든 한국 날짜로 D-day를 센다.
function kstToday(){
  return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
}
function eventDate(event){return String(event.datetimeKst).slice(0,10);}
function dday(event,today){
  const days=daysBetween(today,eventDate(event));
  return days===0?"D-DAY":`D-${days}`;
}
function eventTimeLabel(event){
  const time=String(event.datetimeKst).slice(11,16);
  const [year,month,day]=eventDate(event).split("-");
  return `${Number(month)}월 ${Number(day)}일 ${time}`;
}

function futureEvents(){
  const today=kstToday();
  return (macro.data?.events||[]).filter(event=>eventDate(event)>=today).sort((a,b)=>a.datetimeKst.localeCompare(b.datetimeKst));
}

// 필터는 확대 보기에서만 건다. 컴팩트 카드는 "다음에 무엇이 오는지"를 빠뜨리지 않고
// 보여주는 것이 역할이라, 거기서 조용히 걸러지면 안 온다고 착각하게 된다.
function scheduleEvents(applyFilters){
  let list=futureEvents();
  if(!applyFilters)return list;
  if(scheduleCountry!=="all")list=list.filter(event=>event.country===scheduleCountry);
  if(scheduleImportance!=="all")list=list.filter(event=>event.importance===scheduleImportance);
  return list;
}

// 주·월 묶음은 전부 한국 날짜 기준이다. 지역 시간대가 끼어들면 자정 근처 일정이 옆
// 주로 새므로 UTC 자정으로 고정한 정수 연산만 쓴다.
function dayMs(date){const[y,m,d]=date.split("-").map(Number);return Date.UTC(y,m-1,d);}
function dayStr(ms){const dt=new Date(ms);
  return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,"0")}-${String(dt.getUTCDate()).padStart(2,"0")}`;}
// 주의 시작은 월요일. 일요일 시작으로 하면 주말 이틀이 갈려 "이번 주 일정"이 둘로 나뉜다.
function weekStart(date){const ms=dayMs(date);const back=(new Date(ms).getUTCDay()+6)%7;return dayStr(ms-back*86400000);}
function weekLabel(start){
  const end=dayStr(dayMs(start)+6*86400000);
  const[sy,sm,sd]=start.split("-").map(Number),[ey,em,ed]=end.split("-").map(Number);
  // 달을 넘기는 주는 양쪽 달을 다 적는다 — "8월 31일~6일"은 어느 달의 6일인지 알 수 없다.
  return (sy===ey&&sm===em)?`${sm}월 ${sd}일~${ed}일`:`${sm}월 ${sd}일~${em}월 ${ed}일`;
}
function monthLabel(key){const[y,m]=key.split("-");return `${y}년 ${Number(m)}월`;}

function scheduleGroups(list){
  if(scheduleMode==="near")return[{key:"near",label:null,items:list}];
  const groups=new Map();
  list.forEach(event=>{
    const date=eventDate(event);
    const key=scheduleMode==="week"?weekStart(date):date.slice(0,7);
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push(event);
  });
  return[...groups.entries()].map(([key,items])=>({
    key,label:scheduleMode==="week"?weekLabel(key):monthLabel(key),items,
  }));
}

function scheduleList(list,today,roomy){
  return scheduleGroups(list).map(group=>{
    const rows=group.items.map(event=>eventRow(event,today,roomy)).join("");
    if(!group.label)return rows;
    return `<div class="sched-group">
      <div class="sched-group-head"><span>${escapeHtml(group.label)}</span><span class="sched-group-count">${group.items.length}건</span></div>
      ${rows}
    </div>`;
  }).join("");
}

const SCHEDULE_MODES=[["near","가까운 순"],["week","주별"],["month","월별"]];
function modeSwitch(){
  return `<div class="seg" role="group" aria-label="일정 보기 방식">${SCHEDULE_MODES.map(([value,label])=>
    `<button type="button" class="seg-btn${scheduleMode===value?" on":""}" data-sched-mode="${value}" aria-pressed="${scheduleMode===value}">${label}</button>`
  ).join("")}</div>`;
}
function filterSwitch(name,current,options){
  return `<div class="seg" role="group" aria-label="${escapeHtml(name)}">${options.map(([value,label])=>
    `<button type="button" class="seg-btn${current===value?" on":""}" data-sched-filter="${name}" data-value="${value}" aria-pressed="${current===value}">${label}</button>`
  ).join("")}</div>`;
}

// 만료는 반드시 시끄럽게 알린다. 빈 카드나 "일정이 없습니다" 같은 일반적인 문구로
// 넘기면, 데이터가 낡아서 비어 있는 것인지 원래 일정이 없는 것인지 구별할 수 없다.
const SCHEDULE_SUB="한국·미국 금리 결정과 주요 지표 발표";

function expiredCard(reason,coverageUntil){
  return `<div class="card">
    <h2>다가오는 일정 <span class="pill warn">갱신 필요</span></h2>
    <div class="card-sub">${SCHEDULE_SUB}</div>
    <p class="soon-body">${escapeHtml(reason)}<br>
    이 달력은 <b>${escapeHtml(coverageUntil||"날짜 미상")}</b>까지만 들어 있어요. 새 일정을 넣어야 다시 표시됩니다.</p>
    <div class="card-note">scripts/build-macro-calendar.mjs의 일정표에 새 날짜를 넣고 다시 생성하세요. 각 표 위에 기관별 공표 페이지 주소가 적혀 있습니다.</div>
  </div>`;
}

function scheduleCard(){
  if(macro.status==="loading"){
    return `<div class="card"><h2>다가오는 일정</h2><div class="card-sub">${SCHEDULE_SUB}</div>
      <div style="margin-top:var(--space-4)"><span class="skel" style="width:80%"></span><span class="skel" style="width:60%"></span></div></div>`;
  }
  if(macro.status==="error"){
    return `<div class="card"><h2>다가오는 일정 <span class="pill warn">불러오기 실패</span></h2>
      <div class="card-sub">${SCHEDULE_SUB}</div>
      <p class="soon-body">경제 일정 파일을 불러오지 못했어요. 새로고침해도 계속되면 data/macro-calendar.json을 확인하세요.</p></div>`;
  }

  const today=kstToday();
  const coverageUntil=macro.data?.coverageUntil||null;
  if(coverageUntil&&today>coverageUntil){
    return expiredCard(`오늘(${today})은 등록된 일정 범위를 지났어요.`,coverageUntil);
  }
  const upcoming=scheduleEvents(false);
  if(!upcoming.length){
    return expiredCard("앞으로 남은 일정이 하나도 없어요.",coverageUntil);
  }

  return `<div class="card">
    <div class="chart-head" style="margin-bottom:var(--space-2)">
      <div><h2>다가오는 일정 <span class="pill">${upcoming.length}</span></h2>
        <div class="card-sub" style="margin:0">${SCHEDULE_SUB}</div></div>
      <div class="toolbar"><button type="button" class="btn" data-schedule-more>더보기</button></div>
    </div>
    <div class="sched-modes">${modeSwitch()}</div>
    <div class="schedule-scroll">${scheduleList(upcoming,today,false)}</div>
    ${coverageNote(today)}
  </div>`;
}

// 기관마다 공표 시점이 달라 한쪽 커버리지가 먼저 끝난다. 그 사실을 적어 두지 않으면
// "요즘 금통위 일정이 왜 안 보이지"를 알아챌 방법이 없다.
function coverageNote(today){
  const coverage=macro.data?.coverage||{};
  const labels=macro.data?.coverageLabels||{};
  const runOut=Object.entries(coverage).filter(([,until])=>until&&until<today).map(([key])=>key);
  if(!runOut.length)return"";
  const lines=runOut.map(key=>`${labels[key]||key} 일정은 ${coverage[key]}까지만 있어요`).join(" · ");
  return `<div class="card-note">${escapeHtml(lines)} — 공표되면 추가해야 합니다.</div>`;
}

const ORG_LABELS={FOMC:"FOMC",BOK:"한국은행",KOSTAT:"국가데이터처",MOTIE:"산업통상부",
  BLS:"미 노동통계국",BEA:"미 경제분석국",CENSUS:"미 센서스국",ISM:"ISM"};
function orgLabel(org){return ORG_LABELS[org]||org;}
const COUNTRY_LABELS={KOR:"한국",USA:"미국"};
function countryLabel(country){return COUNTRY_LABELS[country]||country||"";}

function eventRow(event,today,roomy){
  const open=openEventId===event.id;
  // 규칙으로 잡은 예정일은 공표된 날짜와 구별해서 표시한다. 같은 모양으로 보여주면
  // 확정된 일정으로 읽히고, 실제로 하루씩 밀렸을 때 왜 틀렸는지 알 수 없다.
  const approx=event.dateBasis==="rule"?`<span class="sched-approx" title="기관의 공표 규칙으로 잡은 예정일입니다">예정</span>`:"";
  const badge=roomy?orgLabel(event.org):countryLabel(event.country);
  return `<div class="sched-item${open?" open":""}${event.importance==="high"?" high":""}">
    <button type="button" class="sched-head" data-event="${escapeHtml(event.id)}" aria-expanded="${open}">
      <span class="sched-dday">${dday(event,today)}</span>
      <span class="sched-main">
        <span class="sched-title">${escapeHtml(event.title)}</span>
        <span class="sched-when">${escapeHtml(eventTimeLabel(event))}${approx}${roomy&&event.note?` · ${escapeHtml(event.note)}`:""}</span>
      </span>
      <span class="sched-org">${escapeHtml(badge)}</span>
    </button>
    ${open?`<div class="sched-body">
      ${(event.scenarios||[]).map(scenario=>`<div class="scenario">
        <b>${escapeHtml(scenario.label)}</b>
        <p>${escapeHtml(scenario.text)}</p>
      </div>`).join("")}
      <p class="scenario-note">어느 쪽이 될지는 알 수 없습니다. 일반적으로 알려진 파급 경로를 적은 것이고, 투자 판단이나 권유가 아닙니다.</p>
    </div>`:""}
  </div>`;
}

// 더보기로 여는 확대 보기. 카드 안에서는 한 줄에 다 담기 어려운 설명(발표 시각의
// 현지 기준, 시나리오 전문)을 여유 있게 보여주고, 나라·중요도로 걸러 볼 수 있다.
function scheduleOverlay(){
  if(!scheduleExpanded||macro.status!=="ready")return"";
  const today=kstToday();
  const all=scheduleEvents(false);
  const shown=scheduleEvents(true);
  const filtered=shown.length!==all.length;
  const sources=Object.entries(macro.data?.sources||{})
    .map(([org,url])=>`<a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(orgLabel(org))}</a>`).join(" · ");
  // 필터로 0건이 된 것과 일정이 원래 없는 것은 다른 상황이다. 같은 문구로 뭉치지 않는다.
  const body=shown.length
    ?scheduleList(shown,today,true)
    :`<p class="soon-body">고른 조건에 맞는 일정이 없어요. 남은 일정 ${all.length}건은 조건을 넓히면 다시 보입니다.</p>`;
  return `<div class="overlay" data-schedule-close>
    <div class="overlay-panel" role="dialog" aria-modal="true" aria-label="다가오는 경제 일정">
      <div class="overlay-head">
        <div><h2>다가오는 일정</h2>
          <div class="card-sub" style="margin:0">${SCHEDULE_SUB} · ${shown.length}건${filtered?` (전체 ${all.length}건 중)`:""}</div></div>
        <button type="button" class="btn" data-schedule-close>닫기</button>
      </div>
      <div class="sched-controls">
        ${modeSwitch()}
        ${filterSwitch("국가",scheduleCountry,[["all","전체"],["KOR","한국"],["USA","미국"]])}
        ${filterSwitch("중요도",scheduleImportance,[["all","전체"],["high","중요"],["medium","보통"]])}
      </div>
      <div class="overlay-body">${body}</div>
      <div class="card-note">출처: ${sources}</div>
    </div>
  </div>`;
}

const AXES=[["group","자산 유형"],["guaranteed","원금 보장"],["currency","통화"]];
const AXIS_NOTES={
  group:"자산 입력에서 선택한 자산군 기준입니다.",
  guaranteed:"원금 보장 = 원화 현금·예금·적금. 그 외는 시가 변동으로 분류합니다(외화 현금 포함 — 환율에 따라 원화 가치가 변합니다). '안전·위험'이 아니라 원금 보장 여부로 나눕니다.",
  currency:"자산을 매입한 통화 기준입니다. 모든 자산이 통화를 가지므로 분류되지 않는 자산이 없습니다.",
};

function compositionCard(summary){
  const hasPhysical=summary.physical.total>0,hasFinancial=summary.financial.total>0;
  const active=!hasFinancial?"physical":!hasPhysical?"financial":assetClass;
  const side=active==="physical"?summary.physical:summary.financial;
  const parts=(active==="physical"?side.axes.group:side.axes[axis])||[];
  const classToggle=hasPhysical&&hasFinancial?`<div class="tabs">${[["financial","금융자산"],["physical","실물자산"]].map(([key,label])=>
    `<button type="button" class="tab ${active===key?"active":""}" data-class="${key}">${label}</button>`).join("")}</div>`:"";
  // 실물자산은 전부 시가 변동이고 전부 원화라 원금 보장·통화 축이 의미가 없다.
  const axisTabs=active==="financial"?`<div class="tabs">${AXES.map(([key,label])=>
    `<button type="button" class="tab ${axis===key?"active":""}" data-axis="${key}">${label}</button>`).join("")}</div>`:"";
  const note=active==="physical"
    ?"실물자산은 전부 시가 변동이고 전부 원화라 원금 보장·통화 축을 두지 않았습니다."
    :AXIS_NOTES[axis];
  const centerLabel=active==="physical"?"실물자산":"금융자산";
  return `<div class="card">
    <div class="chart-head">
      <div><h2>자산 구성</h2><div class="card-sub" style="margin:0">카테고리별 평가금액과 비중</div></div>
      <div class="toolbar">${classToggle}</div>
    </div>
    ${axisTabs?`<div class="toolbar" style="margin-bottom:var(--space-4)">${axisTabs}</div>`:""}
    <div class="donut-wrap">
      ${donut(parts,centerLabel,won(side.total))}
      <div class="stackbar-note num">${parts.length}개 항목</div>
    </div>
    ${legend(parts)}
    <div class="card-note">${escapeHtml(note)}</div>
  </div>`;
}

// 자리와 제목만 만든다. 데이터 연동은 별도 트랙이다.
function soonCard(title,sub,body){
  return `<div class="card">
    <h2>${escapeHtml(title)} <span class="pill">준비 중</span></h2>
    <div class="card-sub">${escapeHtml(sub)}</div>
    <p class="soon-body">${body}</p>
  </div>`;
}

// 이 칸은 일반 경제 뉴스가 아니라 "보유 자산과 연결된 뉴스"만 담는다.
// 삼성전자를 보유하면 삼성전자 뉴스, 달러 자산이 있으면 환율 뉴스.
// 이 앱은 경제를 공부시키는 도구가 아니라 본인 돈을 이해하게 만드는 도구다 —
// 보유와 무관한 뉴스를 채우면 그 순간 다른 종류의 앱이 된다.
function newsCard(){
  return soonCard("오늘의 주요 뉴스","보유한 자산과 연결된 소식만 모읍니다",
    "삼성전자를 보유하면 삼성전자 소식, 달러 자산이 있으면 환율 소식.<br>보유와 무관한 뉴스는 넣지 않습니다.");
}

// 핵심 지표 몇 개만 올린다. 카드 높이가 상단·중간 행을 끌어올리면 안 되므로
// 의도적으로 적게 두고, 나머지는 더보기로 경제지표 탭에 넘긴다.
// 카드 높이를 지켜야 하므로 의도적으로 적게 둔다. 어느 지표를 올릴지는 카탈로그의
// headline 플래그가 정하고(index.json의 headlineSeries에 값까지 실려 온다),
// 여기서는 그중 네 줄과 나라를 고른다. 주제 파일을 받지 않아도 그려진다.
const HOME_INDICATORS=[
  {indicator:"cli",country:"KOR"},
  {indicator:"cpi",country:"KOR"},
  {indicator:"unemployment",country:"KOR"},
  {indicator:"long-rate",country:"KOR"},
];

function indicatorCard(){
  const state=Indicators.state;
  const head=(badge)=>`<div class="chart-head" style="margin-bottom:var(--space-3)">
      <div><h2>주요 경제지표${badge?` <span class="pill warn">${badge}</span>`:""}</h2>
        <div class="card-sub" style="margin:0">OECD · 갈래별 주요 지표</div></div>
      <div class="toolbar"><a class="btn" href="${INDICATORS_URL}">더보기</a></div>
    </div>`;

  if(state.status==="loading"){
    const bar=(w)=>`<span class="skel" style="width:${w}"></span>`;
    return `<div class="card">${head("")}${bar("80%")}${bar("60%")}</div>`;
  }
  // 없거나 비었으면 0이나 빈 칸으로 때우지 않고 무엇이 없는지 말한다.
  if(state.status==="error"||state.status==="empty"){
    const detail=state.status==="error"
      ?`data/indicators/index.json을 읽지 못했어요 (${escapeHtml(state.error||"원인 미상")}).`
      :"index.json은 있지만 지표가 하나도 없어요.";
    return `<div class="card">${head("확인 필요")}<p class="soon-body">${detail}<br>지표 배치가 한 번이라도 성공했는지 확인하세요.</p></div>`;
  }

  const stale=Indicators.staleness();
  if(stale&&stale.stale){
    return `<div class="card">${head("오래됨")}
      <p class="soon-body">가장 최신 관측이 ${escapeHtml(stale.newest)}로 ${stale.monthsBehind}개월 전이에요(기준 ${Indicators.STALE_MONTHS}개월).<br>지표 배치가 멈췄는지 확인하세요.</p></div>`;
  }

  const rows=HOME_INDICATORS.map(pick=>Indicators.find(pick.indicator,pick.country)).filter(Boolean);
  if(!rows.length){
    return `<div class="card">${head("확인 필요")}
      <p class="soon-body">홈에 올릴 지표(${escapeHtml(HOME_INDICATORS.map(p=>`${p.indicator}/${p.country}`).join(", "))})를 카탈로그에서 찾지 못했어요.</p></div>`;
  }

  return `<div class="card">${head("")}
    <div class="ind-rows">${rows.map(row=>`<div class="ind-row">
      <span class="ind-row-name">${escapeHtml(row.countryKo)} ${escapeHtml(row.indicatorKo)}</span>
      <span class="ind-row-value num">${escapeHtml(Indicators.formatValue(row))}</span>
      <span class="ind-row-period">${escapeHtml(row.periodKo)}</span>
    </div>`).join("")}</div>
  </div>`;
}

// 요약 축은 금융자산 기준으로 고정한다(구성 카드의 전환과 연동하지 않는다).
// 원금 보장·현금화·집중도는 투자 판단과 연결된 지표인데, 실거주 아파트를 팔아
// 집중도를 낮출 수는 없다 — 부동산이 91%면 세 축이 전부 부동산 하나에 끌려간다.
function portfolioCard(summary){
  if(!summary.meters.length){
    if(!summary.total)return"";
    return `<div class="card"><h2>포트폴리오 요약</h2>
      <p class="card-sub">금융자산이 없어 요약 축을 계산하지 않았어요. 이 축들은 금융자산 기준입니다.</p></div>`;
  }
  const guaranteed=summary.meters.find(meter=>meter.key==="guaranteed");
  const concentration=summary.meters.find(meter=>meter.key==="concentration");
  const count=Math.min(3,summary.financial.rows.length);
  return `<div class="card">
    <h2>포트폴리오 요약 <span class="pill">금융자산 기준</span></h2>
    <div class="card-sub">현재 배분 기준 요약</div>
    <div class="summary-text">금융자산 중 원금 보장 자산이 ${pct(guaranteed.value,0)}이고, 상위 ${count}개 자산이 금융자산의 ${pct(concentration.value,0)}예요.</div>
    ${summary.meters.map(meterRow).join("")}
    <div class="card-note">축은 위치를 나타냅니다. 점수나 등급이 아니며, 높다고 좋거나 낮다고 나쁜 것이 아닙니다.<br>
    부동산·원자재는 이 축에서 제외했습니다 — 실거주 주택을 팔아 집중도를 낮출 수는 없으므로, 투자 판단과 연결된 축에 넣으면 숫자가 그쪽으로 끌려갑니다.<br>
    분류 기준: 원금 보장 = 원화 현금·예적금 / 현금화 즉시 = 현금·주식·ETF·가상자산 / 집중도 = 상위 3개 자산 비중 합.</div>
  </div>`;
}

function trendCard(){
  const snapshots=session.snapshots||[];
  return `<div class="card">
    <div class="chart-head"><div><h2>자산 추이</h2><div class="card-sub" style="margin:0">기록된 기준일의 총자산 변동</div></div></div>
    ${snapshots.length<2?`<div class="chart-note">기록이 하루치예요. 내일부터 변화를 볼 수 있어요.</div>`:trendChart(snapshots)}
  </div>`;
}

function plStrip(summary){
  const financial=summary.financial.profit,physical=summary.physical.gap;
  const money=(value)=>`${value>0?"+":value<0?"−":""}${won(Math.abs(value))}`;
  const tone=(value)=>value>0?"pos":value<0?"neg":"";
  const blocks=[];
  blocks.push(financial.count
    ?`<div class="pl-block"><div class="pl-label">평가손익</div>
       <div class="pl-value num ${tone(financial.sum)}">${money(financial.sum)}${financial.rate===null?"":` (${financial.sum>0?"+":financial.sum<0?"−":""}${pct(Math.abs(financial.rate))})`}</div>
       <div class="pl-basis">매입 정보가 있는 ${financial.count}개 금융자산 기준</div></div>`
    :`<div class="pl-block"><div class="pl-label">평가손익</div><div class="pl-value">–</div>
       <div class="pl-basis">매입 정보가 있는 금융자산이 없어요</div></div>`);
  // 실물자산은 시장이 매긴 값이 아니라 사용자가 적어 넣은 추정가와 매입가의 차이라
  // 용어를 나눈다. 같은 줄에 더하면 숫자의 성격이 섞인다.
  if(physical.count)blocks.push(`<div class="pl-block"><div class="pl-label">실물자산 평가차액</div>
    <div class="pl-value num ${tone(physical.sum)}">${money(physical.sum)}${physical.rate===null?"":` (${physical.sum>0?"+":physical.sum<0?"−":""}${pct(Math.abs(physical.rate))})`}</div>
    <div class="pl-basis">사용자가 입력한 추정가 기준 · ${physical.count}개 자산</div></div>`);
  return `<div class="pl-strip">${blocks.join("")}</div>`;
}

function holdingsCard(summary){
  const rows=summary.rows.map(row=>{
    const share=summary.total?row.krw/summary.total:0;
    const physical=row.klass==="physical";
    const pl=row.profit===null
      ?`<span class="pill">매입 정보 없음</span>`
      :`<span class="num ${row.profit>0?"pos":row.profit<0?"neg":""}">${row.profit>0?"+":row.profit<0?"−":""}${won(Math.abs(row.profit))}${physical?" *":""}</span>`;
    return `<tr data-asset="${escapeHtml(row.id||"")}">
      <td class="name">${escapeHtml(row.name)}</td>
      <td><span class="pill">${escapeHtml(row.groupName)}</span></td>
      <td class="right num">${unitPriceCell(row)}</td>
      <td class="right num">${quantityCell(row)}</td>
      <td class="right num">${won(row.krw)}</td>
      <td class="right">${pl}</td>
      <td class="right num">${pct(share)}</td>
      <td class="right" style="color:var(--dim)">${escapeHtml(updatedLabel(row.asset))}</td>
    </tr>`;
  }).join("");
  const hasPhysicalProfit=summary.physical.gap.count>0;
  // 자산이 많으면 이 카드 하나가 화면을 끝없이 늘린다. 상위 4행만 보이는 높이로 고정하고
  // 나머지는 카드 안에서 스크롤한다 — 건수는 머리말에 그대로 적어 무엇이 가려졌는지 알린다.
  const scrolls=summary.rows.length>VISIBLE_HOLDINGS;
  return `<div class="card">
    <div class="chart-head">
      <div><h2>보유 자산</h2><div class="card-sub" style="margin:0">평가금액 높은순 · 전체 ${summary.rows.length}개${scrolls?` (상위 ${VISIBLE_HOLDINGS}개 표시, 스크롤하면 나머지)`:""}</div></div>
      <div class="toolbar"><a class="btn" href="${ASSETS_URL}">자산군별로 보기</a></div>
    </div>
    ${plStrip(summary)}
    <div class="holdings-scroll${scrolls?" capped":""}">
      <table class="data">
        <thead><tr>
          <th>자산명</th><th>자산 유형</th><th class="right">현재가</th><th class="right">보유 수량</th>
          <th class="right">평가금액</th><th class="right">평가손익</th>
          <th class="right">전체 대비 비중</th><th class="right">최근 업데이트</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${hasPhysicalProfit?`<div class="card-note">* 실물자산의 값은 시장이 매긴 손익이 아니라 입력하신 추정가와 매입가의 차이(평가차액)입니다.</div>`:""}
  </div>`;
}

// 단가 개념이 없는 자산군(현금·예적금·펀드·채권·부동산)은 억지로 채우지 않고 –로 둔다.
// 없는 숫자를 만들어 넣으면 있는 숫자와 구별되지 않는다.
function unitPriceCell(row){
  if(row.unitPrice===null||row.unitPrice===undefined)return `<span style="color:var(--dim)">–</span>`;
  const suffix=row.unitLabel==="g"?"원/g":"원";
  return `${Math.round(row.unitPrice).toLocaleString("ko-KR")}${suffix}`;
}
function quantityCell(row){
  if(row.quantity===null||row.quantity===undefined)return `<span style="color:var(--dim)">–</span>`;
  // 가상자산은 소수점이 의미가 있어 자릿수를 살린다(0.05 BTC가 0으로 보이면 안 된다).
  const text=row.quantity.toLocaleString("ko-KR",{maximumFractionDigits:8});
  return `${text}${row.unitLabel?` ${row.unitLabel}`:""}`;
}

function updatedLabel(asset){
  const raw=asset&&(asset.updatedAt||asset.createdAt);
  if(!raw)return"–";
  const days=daysBetween(String(raw).slice(0,10),new Date().toISOString().slice(0,10));
  if(!Number.isFinite(days))return"–";
  if(days<=0)return"오늘";
  if(days===1)return"어제";
  return `${days}일 전`;
}

function comingCards(){
  const items=[["목표 자산","목표를 정하고 지금 어디까지 왔는지 봅니다"],["월간 현금흐름","한 달에 들어오고 나간 돈을 봅니다"],["보유자산 주요 이슈","보유한 종목에 생긴 일만 모읍니다"]];
  return `<div class="grid grid-third" style="margin-top:var(--space-4)">${items.map(([title,note])=>
    `<div class="soon-card"><span class="pill">준비 중인 기능</span><b>${escapeHtml(title)}</b><span>${escapeHtml(note)}</span></div>`).join("")}</div>`;
}

// 진입점은 시각화 자체다 — 기능 진입 전용 버튼을 두지 않는다. 도넛 조각과 범례 행 모두
// 해당 자산군 화면으로 이동하지만, 작은 조각은 누르기 어려우므로 금액·비율이 함께 적힌
// 범례 행이 주 진입점이다.
function bind(){
  document.querySelectorAll("button[data-class]").forEach(button=>{
    button.addEventListener("click",()=>{assetClass=button.dataset.class;render();});
  });
  document.querySelectorAll("button[data-axis]").forEach(button=>{
    button.addEventListener("click",()=>{axis=button.dataset.axis;render();});
  });
  document.querySelectorAll("[data-slice]").forEach(node=>{
    const go=()=>{location.href=`${ASSETS_URL}#composition=${encodeURIComponent(node.dataset.slice)}`;};
    node.addEventListener("click",go);
    // 도넛 조각은 SVG라 키보드 접근을 직접 열어준다(tabindex는 마크업에서 부여).
    node.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();go();}});
  });
  document.querySelectorAll("button[data-go]").forEach(button=>{
    button.addEventListener("click",()=>{location.href=`${INPUT_URL}#add`;});
  });
  document.querySelectorAll("tr[data-asset]").forEach(row=>{
    row.addEventListener("click",()=>{location.href=`${INPUT_URL}#asset=${encodeURIComponent(row.dataset.asset)}`;});
  });

  // 일정 하나를 누르면 그 일정의 시나리오만 펼친다(컴팩트·확대 보기 양쪽 동일).
  document.querySelectorAll("button[data-event]").forEach(button=>{
    button.addEventListener("click",()=>{
      openEventId=openEventId===button.dataset.event?null:button.dataset.event;
      render();
    });
  });
  // 보기 방식과 필터. 고른 값은 모듈 스코프에 남으므로 확대 보기를 열고 닫아도 유지된다.
  document.querySelectorAll("button[data-sched-mode]").forEach(button=>{
    button.addEventListener("click",()=>{scheduleMode=button.dataset.schedMode;render();});
  });
  document.querySelectorAll("button[data-sched-filter]").forEach(button=>{
    button.addEventListener("click",()=>{
      if(button.dataset.schedFilter==="국가")scheduleCountry=button.dataset.value;
      else scheduleImportance=button.dataset.value;
      render();
    });
  });
  document.querySelector("[data-schedule-more]")?.addEventListener("click",()=>{scheduleExpanded=true;render();});
  document.querySelectorAll("[data-schedule-close]").forEach(node=>{
    node.addEventListener("click",event=>{
      // 배경을 눌렀을 때만 닫는다 — 패널 안쪽 클릭으로 닫히면 시나리오를 읽다 사라진다.
      if(event.target!==node)return;
      scheduleExpanded=false;render();
    });
  });
}

render();
Valuation.load().then(render);
// 경제 일정은 시세와 무관한 정적 파일이라 따로 받는다 — 한쪽이 늦어도 다른 쪽을 막지 않는다.
loadMacroCalendar().then(render);
// 경제지표 카탈로그도 독립적으로 받는다 — 한쪽이 늦어도 다른 카드를 막지 않는다.
Indicators.load().then(render);
</script>
