<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AssetFlow</title>
  <!-- 폰트는 렌더를 막지 않게 받는다. 도착 전에는 폴백으로 읽히고 도착하면 바뀐다. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="lib/app.css">
</head>
<body><main class="empty-state"><h1>AssetFlow</h1><p>계정 정보를 확인하고 있어요.</p></main>
<script src="lib/supabase-config.js?v=20260811-1"></script><script src="lib/account-store.js"></script>
<script>
  // 진입점은 자산 유무를 보기 전에 인증부터 확인한다. 새 기기라면 로그인 화면이
  // 원격 세션을 내려받은 뒤 홈 또는 입력 화면으로 보낸다.
  (async function(){
    const current=AccountStore.auth();
    if(!current?.user)return location.replace("login.html");
    try{
      const result=await AccountStore.loadRemote({required:true});
      location.replace(result.status==="ok"&&result.session?.assets?.length?"home.html":"asset-input.html");
    }catch(error){
      console.error("[진입점] 계정 데이터 조회 실패:",error);
      location.replace("login.html?loadError=1");
    }
  })();
</script>
</body>
</html>
