const STORAGE_KEY="assetInput.session";
const GROUPS=[{id:"cash",name:"현금"},{id:"savings",name:"예금·적금"},{id:"equity",name:"주식·ETF"},{id:"crypto",name:"가상자산"},{id:"fund",name:"펀드"},{id:"bond",name:"채권"},{id:"commodity",name:"원자재·실물자산"},{id:"realestate",name:"부동산"}];

const emptySession=()=>({selectedGroups:[],currentGroupIndex:0,assets:[],completed:false,drafts:{},recentSearches:[],skippedGroups:[]});
let session=loadSession(),screen=session.completed?"done":"checklist",resumeVisible=!session.completed&&session.selectedGroups.length>0,sheetState=null,duplicateState=null,lastAddedId=null,saveTimer=null,searchTimer=null,renderDirection="forward";
const composing=new WeakSet();

function loadSession(){try{return Object.assign(emptySession(),JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}"));}catch(error){return emptySession();}}
function saveNow(){clearTimeout(saveTimer);localStorage.setItem(STORAGE_KEY,JSON.stringify(session));}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,300);}
function esc(value){return String(value??"").replace(/[&<>\"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[char]));}
function uid(){return "asset-"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function groupName(id){return GROUP_MAP[id]?.name||id;}
function defaults(group){return {cash:{currency:"KRW"},savings:{productType:"예금"},commodity:{assetKind:"금",holdingMethod:"KRX 현물"},realestate:{propertyType:"아파트",purpose:"실거주",basis:"시세",priceDate:new Date().toISOString().slice(0,10),joint:false}}[group]||{};}
function freshDraft(group){return {fields:Object.assign({},defaults(group)),autoFields:{},estimatedFields:{},touched:{},unknownFields:{},editingId:null};}
function draft(group){if(!session.drafts[group])session.drafts[group]=freshDraft(group);session.drafts[group].touched||={};session.drafts[group].unknownFields||={};return session.drafts[group];}
function persistDraft(group,name,value,{touch=true}={}){const item=draft(group);item.fields[name]=value;if(touch)item.touched[name]=true;item.updatedAt=new Date().toISOString();refreshDerived(group);scheduleSave();}
function setAuto(group,data){draft(group).autoFields=data||{};scheduleSave();}
function hasEstimate(item){return Object.values(item.estimatedFields||{}).some(Boolean)||item.fields.directMode===true||["시세","자체 추정"].includes(item.fields.basis);}
function moneyDigits(value){return String(value||"").replace(/[^0-9.]/g,"");}
function comma(value){const number=Number(moneyDigits(value));return Number.isFinite(number)&&number?number.toLocaleString("ko-KR"):"";}
function currencyCode(group,item=draft(group)){if(group==="cash")return item.fields.currency||"KRW";return item.autoFields?.currency||"KRW";}
function readMoney(value,currency="KRW"){const n=Number(moneyDigits(value));if(!n)return"";if(currency!=="KRW")return `${currency} ${n.toLocaleString("ko-KR")}`;const units=[[100000000,"억"],[10000,"만"]],parts=[];let rest=n;units.forEach(([size,label])=>{const count=Math.floor(rest/size);if(count){parts.push(count.toLocaleString("ko-KR")+label);rest%=size;}});if(rest)parts.push(rest.toLocaleString("ko-KR"));return parts.join(" ")+" 원";}
function initials(text){const base=44032;return [...String(text)].map(char=>{const code=char.charCodeAt(0)-base;if(code<0||code>11171)return char;return "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ"[Math.floor(code/588)];}).join("");}
function lookupProducts(group,query){const source=group==="equity"?MOCK_TICKERS:(MOCK.products[group]||[]),q=String(query||"").trim().toLowerCase();if(!q)return[];return source.filter(product=>`${product.name} ${product.code} ${product.aliases||""} ${initials(product.name)}`.toLowerCase().includes(q)).slice(0,20);}
function productByCode(group,code){return (group==="equity"?MOCK_TICKERS:(MOCK.products[group]||[])).find(product=>product.code===code);}
function refreshDerived(group){const item=draft(group),fields=item.fields;if(group==="cash"){const rate=MOCK.rates[fields.currency]||1;item.autoFields=fields.currency==="KRW"?{}:{currency:fields.currency,exchangeRate:rate,krwValue:Math.round(Number(fields.amount||0)*rate)};}if(["equity","crypto"].includes(group)){const product=productByCode(group,fields.productCode),price=fields.directMode?Number(fields.currentPrice):product?.currentPrice;if(price&&Number(fields.quantity)>0)item.autoFields.valuation=Math.round(Number(fields.quantity)*price);}if(group==="commodity"&&Number(fields.quantity)>0&&fields.holdingMethod!=="기타"){const unit=fields.holdingMethod==="실물 보유"&&fields.assetKind==="금"?"돈":"g",grams=unit==="돈"?Number(fields.quantity)*3.75:Number(fields.quantity),price=fields.assetKind==="은"?MOCK.commodityPrices.silverPerGram:MOCK.commodityPrices.goldPerGram;item.autoFields={price,valuation:Math.round(grams*price),currency:"KRW"};}}

function label(text,opts={}){return `<div class="label-row"><span class="label">${text}${opts.estimated?'<span class="estimate-tag">추정</span>':""}</span><span class="label-actions">${opts.how?`<button type="button" class="how" data-how="${opts.target}" data-title="${opts.how}">어디서 확인하나요?</button>`:""}${opts.optional?'<span class="optional-tag">선택</span>':""}</span></div>`;}
function inputField(group,name,title,opts={}){const item=draft(group),value=item.fields[name]??"",money=Boolean(opts.money),currency=opts.currency||currencyCode(group,item),attrs=[`id="field-${group}-${name}"`,`data-field="${name}"`,`data-group="${group}"`,`class="control ${money?"money":""}"`,`value="${esc(money&&document.activeElement?.id!==`field-${group}-${name}`?comma(value):value)}"`,`placeholder="${esc(opts.placeholder||"")}"`,`type="${opts.type||"text"}"`];if(opts.numeric||money)attrs.push('inputmode="decimal"');return `<div class="field">${label(title,{optional:opts.optional,estimated:Boolean(item.estimatedFields[name]),how:opts.how,target:name})}<input ${attrs.join(" ")}>${money?`<div class="readback" data-readback="${group}-${name}">${readMoney(value,currency)}</div>`:""}${opts.help?`<div class="help">${opts.help}</div>`:""}</div>`;}
function selectField(group,name,title,options,opts={}){const item=draft(group),value=item.fields[name]??"";return `<div class="field">${label(title,{optional:opts.optional,how:opts.how,target:name})}<select class="control" data-field="${name}" data-group="${group}">${opts.placeholder?`<option value="">${opts.placeholder}</option>`:""}${options.map(option=>{const valuePart=Array.isArray(option)?option[0]:option,labelPart=Array.isArray(option)?option[1]:option;return `<option value="${esc(valuePart)}" ${value===valuePart?"selected":""}>${esc(labelPart)}</option>`;}).join("")}</select>${opts.note?`<div class="inline-note">${opts.note}</div>`:""}</div>`;}
function chips(group,name,title,values,opts={}){const item=draft(group),value=item.fields[name]??"";return `<div class="field">${label(title,{optional:opts.optional,how:opts.how,target:name})}<div class="chips" data-chipset="${name}" data-group="${group}">${values.map(v=>`<button type="button" class="chip ${value===v?"active":""}" data-value="${esc(v)}">${esc(v)}</button>`).join("")}</div>${opts.clear?`<button type="button" class="clear-choice" data-clear-field="${name}" data-group="${group}">건너뛰기</button>`:""}${opts.help?`<div class="help">${opts.help}</div>`:""}</div>`;}
function dateField(group,name,title,optional=true){const item=draft(group),unknown=Boolean(item.unknownFields[name]);return `<div class="field">${label(title,{optional})}<div class="row"><input id="field-${group}-${name}" class="control" type="date" data-field="${name}" data-group="${group}" value="${unknown?"":esc(item.fields[name]||"")}" ${unknown?"disabled":""}><label class="unknown-wrap"><input type="checkbox" data-unknown="${name}" data-group="${group}" ${unknown?"checked":""}>모름</label></div></div>`;}
function optionalSection(group,count,names,body){return `<details class="optional" data-details="optional-${group}"><summary class="optional-summary"><span><b>＋ 선택 정보 입력하기</b><small>${names.join(" · ")}</small></span><span>${count}개⌄</span></summary><div class="optional-body">${body}</div></details>`;}
function searchField(group,title,placeholder){const query=draft(group).fields.search||"";return `<div class="field search-field">${label(title)}<input id="field-${group}-search" class="control" data-search="${group}" data-field="search" data-group="${group}" value="${esc(query)}" placeholder="${placeholder}" autocomplete="off"><div class="search-host" data-search-host="${group}" hidden></div></div>`;}
function searchResult(group,product){let info=product.code;if(group==="fund")info=`${product.fundType} · ${product.region} · ${product.hedge} · ${product.code}`;if(group==="bond")info=`${product.maturity.slice(0,4)}년 ${product.maturity.slice(5)}월 만기 · 표면 ${product.coupon}<br><span>${product.code}</span>`;return `<button type="button" class="search-result" data-product="${esc(product.code)}" data-product-group="${group}"><b>${esc(product.name)}</b><small>${info}</small></button>`;}
function directLabel(group){return {equity:"찾는 종목이 없어요 → 직접 등록",fund:"찾는 펀드가 없어요 → 직접 등록",bond:"찾는 채권이 없어요 → 직접 등록"}[group]||"";}
function renderSearchResults(group,query,{recentOnly=false}={}){const host=document.querySelector(`[data-search-host="${group}"]`);if(!host)return;let products=[];if(recentOnly){const codes=session.recentSearches.filter(item=>item.group===group).map(item=>item.code);products=codes.map(code=>productByCode(group,code)).filter(Boolean);if(!products.length){host.hidden=true;host.innerHTML="";return;}}else products=lookupProducts(group,query);host.hidden=false;host.innerHTML=(products.length?(recentOnly?'<div class="search-caption">최근 검색</div>':"")+products.map(product=>searchResult(group,product)).join(""):`<div class="empty-search">검색 결과가 없습니다.</div>`)+(!recentOnly&&directLabel(group)?`<button type="button" class="direct-row" data-direct="${group}">${directLabel(group)}</button>`:"");bindDynamic(host);}
function currencyPicker(){const group="cash",item=draft(group),selected=CURRENCIES.find(row=>row[0]===item.fields.currency)||CURRENCIES[0];return `<div class="field">${label("통화")}<input id="field-cash-currencySearch" class="control" data-currency-search value="" placeholder="통화명 · 영문명 · 코드 검색" autocomplete="off"><div class="currency-pinned">${CURRENCIES.slice(0,5).map(row=>`<button type="button" class="chip ${row[0]===selected[0]?"active":""}" data-currency="${row[0]}">${row[0]}</button>`).join("")}</div><div class="search-host" data-currency-host hidden></div><div class="help">선택: ${selected[0]} · ${selected[1]}</div></div>`;}
function renderCurrencyResults(query=""){const host=document.querySelector("[data-currency-host]");if(!host)return;const q=query.trim().toLowerCase(),rows=(q?CURRENCIES.filter(row=>row.join(" ").toLowerCase().includes(q)):CURRENCIES.slice(5)).slice(0,50);host.hidden=false;host.innerHTML=rows.map(row=>`<button type="button" class="search-result" data-currency="${row[0]}"><b>${row[0]} · ${row[1]}</b><small>${row[2]}</small></button>`).join("");bindDynamic(host);}
function autoCard(group){const auto=draft(group).autoFields||{};if(group==="cash"){if(draft(group).fields.currency==="KRW")return"";return `<div class="auto-card"><div class="auto-title">적용 환율</div><div class="auto-grid"><div><span>${draft(group).fields.currency}/KRW</span><b>${Number(auto.exchangeRate||1).toLocaleString("ko-KR")}</b></div><div><span>업데이트</span><b>오늘 오전 6시 기준</b></div></div></div>`;}const omit=group==="crypto"?["marketCap"]:[],entries=Object.entries(auto).filter(([key,value])=>value!==undefined&&value!==""&&!omit.includes(key));if(!entries.length)return"";const labels={currentPrice:"현재가",currency:"통화",market:"시장",sector:"섹터",country:"국가",etfType:"ETF 유형",underlying:"기초자산",valuation:"평가금액",standardPrice:"기준가",fundType:"펀드 유형",region:"투자 지역",hedge:"환헤지 여부",maturity:"만기일",bondType:"채권 유형",rating:"신용등급",coupon:"표면금리",interestCycle:"이자 지급 주기",category:"카테고리",price:"시세"};return `<div class="auto-card"><div class="auto-title">자동으로 확인했어요</div><div class="auto-grid">${entries.map(([key,value])=>`<div><span>${labels[key]||key}</span><b>${esc(formatAuto(key,value))}</b></div>`).join("")}<div><span>업데이트</span><b>오늘 오전 6시 기준</b></div></div></div>`;}
function formatAuto(key,value){return ["currentPrice","valuation","standardPrice","price"].includes(key)&&Number.isFinite(Number(value))?Number(value).toLocaleString("ko-KR")+(key==="standardPrice"?"":"원"):value;}

function checklist(){return `<div class="view"><h1>어떤 자산을 등록할까요?</h1>${resumeVisible?resumeCard():""}<div class="group-list">${GROUPS.map(group=>`<label class="group-option"><input type="checkbox" data-group-check="${group.id}" ${session.selectedGroups.includes(group.id)?"checked":""}><b>${group.name}</b></label>`).join("")}</div><div class="sticky-actions"><button class="btn primary" data-start ${session.selectedGroups.length?"":"disabled"}>입력 시작하기</button></div><p class="trust-line">계좌를 연결하지 않습니다. 직접 입력한 정보만 사용합니다.</p></div>`;}
function resumeCard(){const current=session.selectedGroups[session.currentGroupIndex]||session.selectedGroups[0];return `<div class="resume"><p>${groupName(current)}부터 이어서 하시겠어요?</p><div class="resume-actions"><button data-resume>이어하기</button><button data-restart>처음부터</button></div></div>`;}
function cash(){const g="cash",item=draft(g),currency=item.fields.currency||"KRW";return `${currencyPicker()}${inputField(g,"amount","금액",{money:true,numeric:true,currency})}${chips(g,"purpose","용도",["생활비","투자 대기","비상금"],{optional:true})}${autoCard(g)}`;}
function savings(){const g="savings",type=draft(g).fields.productType||"예금";return `${chips(g,"productType","상품 유형",["예금","적금"])}${inputField(g,"balance","현재 잔액",{money:true,numeric:true})}${selectField(g,"maturityRange","만기",["6개월 이내","6개월~1년","1~3년","3년 이상","만기 없음"],{placeholder:"만기 구간 선택",how:"만기일 확인하기"})}${optionalSection(g,type==="적금"?6:5,["금융기관","금리","가입일","세제 유형"],`${inputField(g,"institution","금융기관",{optional:true})}${inputField(g,"interestRate","금리",{optional:true,numeric:true,how:"금리 확인하기"})}${dateField(g,"joinedAt","가입일")}${type==="적금"?inputField(g,"monthlyPayment","월 납입액",{optional:true,money:true,numeric:true}):""}${chips(g,"taxType","세제 유형",["일반","비과세","세금우대"],{optional:true})}${dateField(g,"maturityDate","정확한 만기일")}`)}`;}
function equity(){const g="equity",item=draft(g),direct=item.fields.directMode;return `${direct?`${inputField(g,"directName","종목명",{placeholder:"자유 입력"})}${chips(g,"directMarket","시장",["국내","미국","기타"])}${inputField(g,"quantity","보유 수량",{numeric:true,placeholder:"0"})}${inputField(g,"currentPrice","현재가",{money:true,numeric:true})}<button type="button" class="btn ghost" data-direct="equity">종목 검색으로 돌아가기</button>`:`${searchField(g,"종목 검색","한글명 · 영문명 · 티커 · 초성")}${inputField(g,"quantity","보유 수량",{numeric:true,placeholder:"0",help:"소수점 아래 6자리까지 입력할 수 있어요."})}`}${autoCard(g)}${optionalSection(g,2,["평균 매입단가","계좌 유형"],`${inputField(g,"averagePrice","평균 매입단가",{optional:true,money:true,numeric:true,how:"평균 매입단가 확인하기"})}${chips(g,"accountType","계좌 유형",["일반","ISA","연금저축","IRP·DC"],{optional:true,clear:true})}`)}`;}
function crypto(){const g="crypto";return `<div class="inline-note">지갑 주소는 묻지 않습니다. 수량만 입력합니다.</div>${searchField(g,"코인 검색","한글명 · 영문명 · 심볼")}${inputField(g,"quantity","보유 수량",{numeric:true,placeholder:"0",help:"소수점 아래 8자리까지 입력할 수 있어요."})}${autoCard(g)}${optionalSection(g,3,["평균 매입단가","최초 매입일","보관처 라벨"],`${inputField(g,"averagePrice","평균 매입단가",{optional:true,money:true,numeric:true})}${dateField(g,"firstBoughtAt","최초 매입일")}${chips(g,"storageType","보관처 라벨",["국내 거래소","해외 거래소","개인 지갑"],{optional:true})}`)}`;}
function fund(){const g="fund",item=draft(g),direct=item.fields.directMode;return `${direct?`${chips(g,"fundTypeManual","펀드 유형",["주식형","채권형","혼합형","대체투자","기타"])}${chips(g,"regionManual","투자 지역",["국내","해외","글로벌"])}<button type="button" class="btn ghost" data-direct="fund">상품 검색으로 돌아가기</button>`:searchField(g,"상품 검색","펀드명 · 펀드코드")}${inputField(g,"valuation","현재 평가금액",{money:true,numeric:true,how:"평가금액 확인하기"})}${autoCard(g)}${optionalSection(g,5,["매입금액","최초 매입일","적립식","판매사"],`${inputField(g,"purchaseAmount","매입금액",{optional:true,money:true,numeric:true})}${dateField(g,"firstBoughtAt","최초 매입일")}${chips(g,"installment","납입 방식",["적립식","거치식"],{optional:true})}${item.fields.installment==="적립식"?inputField(g,"monthlyPayment","월 납입액",{optional:true,money:true,numeric:true}):""}${inputField(g,"seller","판매사",{optional:true})}`)}`;}
function bond(){const g="bond",item=draft(g),direct=item.fields.directMode;return `${direct?`${selectField(g,"countryCurrency","국가·통화",["한국 KRW","미국 USD","기타"],{placeholder:"선택"})}${chips(g,"bondTypeManual","채권 종류",["국채","지방채·특수채","회사채","해외채권"])}${chips(g,"maturityManual","만기 구간",["1년 이하","1~5년","5~10년","10년 이상"])}<button type="button" class="btn ghost" data-direct="bond">채권 검색으로 돌아가기</button>`:searchField(g,"채권 검색","채권명 · 종목코드")}${inputField(g,"valuation","현재 평가금액",{money:true,numeric:true,how:"평가금액 확인하기"})}${autoCard(g)}${optionalSection(g,3,["매입금액","매입일","액면가·보유 수량"],`${inputField(g,"purchaseAmount","매입금액",{optional:true,money:true,numeric:true})}${dateField(g,"boughtAt","매입일")}${inputField(g,"faceQuantity","액면가·보유 수량",{optional:true,numeric:true})}`)}`;}
function commodity(){const g="commodity",item=draft(g),kind=item.fields.assetKind||"금",method=item.fields.holdingMethod||"KRX 현물",direct=method==="기타",physical=method==="실물 보유",unit=physical&&kind==="금"?"돈":"g",quantity=Number(item.fields.quantity||0);return `${chips(g,"assetKind","자산 종류",["금","은","기타 귀금속","원유/에너지","기타 원자재"])}${chips(g,"holdingMethod","보유 방식",["KRX 현물","금통장","실물 보유","기타"])}${direct?inputField(g,"valuation","현재 평가금액",{money:true,numeric:true}):inputField(g,"quantity",`보유 수량 (${unit})`,{numeric:true,placeholder:"0",how:"보유 수량 확인하기",help:unit==="돈"?(quantity?`${quantity}돈 = ${(quantity*3.75).toLocaleString("ko-KR")}g`:"1돈은 3.75g으로 자동 환산합니다."):"수량과 시세로 평가금액을 자동 계산합니다."})}${autoCard(g)}${optionalSection(g,4,["매입금액","매입일","순도","보관처 라벨"],`${inputField(g,"purchaseAmount","매입금액",{optional:true,money:true,numeric:true})}${dateField(g,"boughtAt","매입일")}${physical?chips(g,"purity","순도",["24K","18K","14K"],{optional:true}):""}${inputField(g,"storageLabel","보관처 라벨",{optional:true})}`)}`;}
function realestate(){const g="realestate",item=draft(g),joint=item.fields.joint===true||item.fields.joint==="true",districts=DISTRICTS[item.fields.province]||[];return `${chips(g,"propertyType","종류",["아파트","오피스텔","빌라/다세대","단독/다가구","토지","상가/기타"])}${chips(g,"purpose","보유 목적",["실거주","임대","투자"])}<div class="row">${selectField(g,"province","시·도",Object.keys(DISTRICTS),{placeholder:"선택"})}${selectField(g,"district","시·군·구",districts,{placeholder:"선택"})}</div><div class="inline-note">상세 주소는 묻지 않습니다. 지역까지만 입력합니다.</div>${inputField(g,"valuation","현재 추정가치",{money:true,numeric:true,how:"추정가치 확인하기"})}${chips(g,"basis","산정 기준",["실거래가","시세","공시가격","자체 추정"])}${inputField(g,"priceDate","가격 기준일",{type:"date"})}<div class="inline-note">부동산 가격은 매일 바뀌지 않습니다. 월 단위로 갱신하거나 직접 수정할 수 있어요.</div><div class="field">${label("공동명의 지분율")}<div class="toggle-row"><span>공동명의예요</span><span>${joint?"켜짐":"꺼짐 · 지분 100%"}</span><button type="button" class="toggle ${joint?"on":""}" data-toggle="joint" data-group="${g}" aria-pressed="${joint}"></button></div>${joint?inputField(g,"ownershipRate","지분율 (%)",{numeric:true}):""}</div>${optionalSection(g,3,["매입가격","매입일","면적"],`${inputField(g,"purchasePrice","매입가격",{optional:true,money:true,numeric:true})}${dateField(g,"boughtAt","매입일")}${inputField(g,"area","면적",{optional:true,numeric:true,placeholder:"숫자 입력"})}${chips(g,"areaUnit","면적 단위",["㎡","평"],{optional:true})}`)}`;}
function groupBody(group){return ({cash,savings,equity,crypto,fund,bond,commodity,realestate})[group]();}
function assetName(asset){const f=asset.fields;return asset.group==="cash"?"현금":asset.group==="savings"?`${f.productType||"예금·적금"}`:asset.group==="commodity"?`${f.assetKind||"원자재"} (${f.holdingMethod||"보유"})`:asset.group==="realestate"?`${f.propertyType||"부동산"}${f.district?` · ${f.district}`:""}`:f.productName||f.directName||f.search||groupName(asset.group);}
function assetDetail(asset){const f=asset.fields,a=asset.autoFields||{};if(asset.group==="cash"){const currency=f.currency||"KRW",rate=MOCK.rates[currency]||1,krw=Math.round(Number(f.amount||0)*rate);return `${currency} ${Number(f.amount||0).toLocaleString("ko-KR")}${currency!=="KRW"?` · 약 ${krw.toLocaleString("ko-KR")}원`:""}`;}if(asset.group==="equity")return `${Number(f.quantity||0).toLocaleString("ko-KR")} ${f.productCode||"주"}${a.valuation?` · ${Number(a.valuation).toLocaleString("ko-KR")}원`:""}`;if(asset.group==="crypto")return `${Number(f.quantity||0).toLocaleString("ko-KR")} ${f.productCode||""}${a.valuation?` · ${Number(a.valuation).toLocaleString("ko-KR")}원`:""}`;if(asset.group==="commodity"){const unit=f.holdingMethod==="실물 보유"&&f.assetKind==="금"?"돈":"g";return f.holdingMethod==="기타"?`${Number(f.valuation||0).toLocaleString("ko-KR")}원`:`${Number(f.quantity||0).toLocaleString("ko-KR")}${unit}${a.valuation?` · ${Number(a.valuation).toLocaleString("ko-KR")}원`:""}`;}const amount=f.valuation||f.balance;return amount?`${Number(amount).toLocaleString("ko-KR")}원`:"";}
function savedList(group){const editingId=draft(group).editingId,assets=session.assets.filter(asset=>asset.group===group&&asset.id!==editingId);if(!assets.length)return"";return `<div class="saved-items"><h2>등록한 ${groupName(group)}</h2>${assets.map(asset=>`<div class="saved-item ${asset.id===lastAddedId?"new":""}"><div><b class="saved-name">${esc(assetName(asset))}${asset.isEstimated?'<span class="estimate-tag">추정</span>':""}</b><span class="saved-detail">${esc(assetDetail(asset))}</span></div><span class="saved-actions"><button data-edit-asset="${asset.id}">수정</button><button data-remove="${asset.id}">삭제</button></span></div>`).join("")}</div>`;}
function inputScreen(){const group=session.selectedGroups[session.currentGroupIndex];if(!group){screen="review";return review();}const assets=session.assets.filter(asset=>asset.group===group),showSkip=!assets.length&&!draft(group).editingId;return `<div class="view enter-${renderDirection}"><div class="progress">자산 ${session.currentGroupIndex+1} / ${session.selectedGroups.length}</div><h1>${groupName(group)}</h1>${session.currentGroupIndex===0?'<p class="sub">변경 내용은 자동으로 저장됩니다.</p>':""}<section class="section"><h2>필수 정보</h2>${groupBody(group)}</section><button type="button" class="btn ghost add-another" data-add-another>＋ 같은 자산군 하나 더 등록</button>${savedList(group)}<div class="sticky-actions"><button class="btn secondary" data-back>이전</button><button class="btn primary" data-next>등록하고 ${session.currentGroupIndex===session.selectedGroups.length-1?"검토하기":"다음"}</button>${showSkip?'<button class="skip" data-skip>나중에 입력하기</button>':""}</div></div>`;}
function formIsEmpty(item){return !item.editingId&&Object.keys(item.touched||{}).length===0;}
function requiredReady(group,item){const f=item.fields||{},present=name=>String(f[name]??"").trim()!=="";if(group==="cash")return present("currency")&&Number(f.amount)>0;if(group==="savings")return present("productType")&&Number(f.balance)>0&&present("maturityRange");if(group==="equity")return f.directMode?(present("directName")&&present("directMarket")&&Number(f.quantity)>0&&Number(f.currentPrice)>0):(present("productCode")&&Number(f.quantity)>0);if(group==="crypto")return present("productCode")&&Number(f.quantity)>0;if(group==="fund")return Number(f.valuation)>0&&(f.directMode?(present("fundTypeManual")&&present("regionManual")):present("productCode"));if(group==="bond")return Number(f.valuation)>0&&(f.directMode?(present("countryCurrency")&&present("bondTypeManual")&&present("maturityManual")):present("productCode"));if(group==="commodity")return present("assetKind")&&present("holdingMethod")&&Number(f.holdingMethod==="기타"?f.valuation:f.quantity)>0;if(group==="realestate")return present("propertyType")&&present("purpose")&&present("province")&&present("district")&&Number(f.valuation)>0&&present("basis")&&present("priceDate")&&(!f.joint||Number(f.ownershipRate)>0);return false;}
function commitAsset(group,item,extraFields={}){const now=new Date().toISOString(),fields=Object.assign({},item.fields,extraFields),estimated=hasEstimate(item);if(item.editingId){const existing=session.assets.find(asset=>asset.id===item.editingId);if(existing){existing.fields=fields;existing.autoFields=Object.assign({},item.autoFields);existing.isEstimated=estimated;existing.updatedAt=now;lastAddedId=existing.id;}}else{const asset={id:uid(),group,fields,autoFields:Object.assign({},item.autoFields),isEstimated:estimated,createdAt:now,updatedAt:now};session.assets.push(asset);lastAddedId=asset.id;}session.skippedGroups=session.skippedGroups.filter(id=>id!==group);session.drafts[group]=freshDraft(group);saveNow();}
function nextAction(){const group=session.selectedGroups[session.currentGroupIndex],item=draft(group),assets=session.assets.filter(asset=>asset.group===group);if(item.editingId){if(!requiredReady(group,item))return toastHelp("필수 정보를 확인해주세요.");commitAsset(group,item);return advance();}if(formIsEmpty(item)){if(assets.length)return advance();return toastHelp("필수 정보를 입력하거나 ‘나중에 입력하기’를 선택해주세요.");}if(assets.length){sheetState={type:"pending",group};return render();}if(!requiredReady(group,item))return toastHelp("필수 정보를 확인해주세요.");commitAsset(group,item);advance();}
function addAnother(){const group=session.selectedGroups[session.currentGroupIndex],item=draft(group);if(!requiredReady(group,item))return toastHelp("필수 정보를 확인해주세요.");const duplicate=item.fields.productCode&&session.assets.find(asset=>asset.group===group&&asset.fields.productCode===item.fields.productCode&&asset.id!==item.editingId);if(duplicate){duplicateState={existing:duplicate,newItem:structuredClone(item),group,after:"stay"};return render();}commitAsset(group,item);render();}
function advance(){if(session.currentGroupIndex<session.selectedGroups.length-1){session.currentGroupIndex+=1;screen="input";}else screen="review";renderDirection="forward";saveNow();render();}
function restoreLastAsset(group){const assets=session.assets.filter(asset=>asset.group===group);if(!assets.length){session.drafts[group]=freshDraft(group);return;}const asset=assets[assets.length-1];session.drafts[group]={fields:Object.assign({},asset.fields),autoFields:Object.assign({},asset.autoFields),estimatedFields:asset.isEstimated?{restored:true}:{},touched:Object.fromEntries(Object.keys(asset.fields).map(key=>[key,true])),unknownFields:{},editingId:asset.id};}
function goBack(){if(session.currentGroupIndex===0){screen="checklist";}else{session.currentGroupIndex-=1;restoreLastAsset(session.selectedGroups[session.currentGroupIndex]);screen="input";}renderDirection="back";saveNow();render();}
function skipGroup(){const group=session.selectedGroups[session.currentGroupIndex];session.skippedGroups=[...new Set([...session.skippedGroups,group])];session.drafts[group]=freshDraft(group);saveNow();advance();}
function review(){const rows=session.selectedGroups.map(groupId=>{const group=GROUP_MAP[groupId],assets=session.assets.filter(asset=>asset.group===groupId),estimated=assets.some(asset=>asset.isEstimated),skipped=!assets.length;return `<details class="review-group" data-details="review-${groupId}"><summary><b>${group.name}</b>${skipped?'<span class="skipped-tag">나중에 입력</span>':`<span>${assets.length}건</span>`}${estimated?'<span class="estimate-tag">추정</span>':""}<span>⌄</span></summary><div class="review-assets">${skipped?`<button class="review-asset" data-review-group="${groupId}">나중에 입력한 항목 열기</button>`:assets.map(asset=>`<button class="review-asset" data-review-edit="${asset.id}"><b>${esc(assetName(asset))}${asset.isEstimated?'<span class="estimate-tag">추정</span>':""}</b><span class="saved-detail">${esc(assetDetail(asset))}</span></button>`).join("")}</div></details>`;}).join("");return `<div class="view enter-${renderDirection}"><h1>등록한 자산</h1><div class="review-list">${rows}</div><details class="optional" data-details="review-analysis"><summary class="optional-summary"><span><b>더 정확한 분석을 위해 채울 수 있는 항목이 있어요</b><small>평균 매입단가 · 매입일 · 용도</small></span><span>⌄</span></summary><div class="optional-body"><p class="sub">평균 매입단가로 손익을, 매입일로 보유기간을, 현금 용도로 자금 성격을 더 정교하게 볼 수 있어요.</p></div></details><h2>자산 입력을 완료하시겠습니까?</h2><div class="sticky-actions"><button class="btn primary" data-complete>완료하기</button><button class="btn secondary" data-edit>수정하기</button></div></div>`;}
function done(){return `<div class="view done"><div class="done-mark">✓</div><h1>자산 입력을 완료했어요</h1><p class="sub">등록한 자산을 바탕으로 보유 자산 가치를 확인할 수 있어요.</p><button class="btn secondary" data-edit>등록 내용 수정하기</button></div>`;}
function sheet(){if(!sheetState&&!duplicateState)return"";if(sheetState?.type==="pending")return `<div class="sheet-backdrop"><div class="sheet"><div class="sheet-head"><h2>작성 중인 항목이 있어요.</h2><button class="close" data-close>×</button></div><div class="dialog-actions"><button class="choice" data-pending="commit"><b>등록하고 넘어가기</b></button><button class="choice" data-pending="discard"><b>지우고 넘어가기</b></button></div></div></div>`;if(duplicateState){const name=duplicateState.newItem.fields.productName||duplicateState.newItem.fields.search;if(duplicateState.mode==="account")return `<div class="sheet-backdrop"><div class="sheet"><div class="sheet-head"><h2>계좌 유형을 선택하거나 건너뛰세요</h2><button class="close" data-close>×</button></div><div class="dialog-actions">${["일반","ISA","연금저축","IRP·DC"].map(type=>`<button class="choice" data-separate-account="${type}"><b>${type}</b></button>`).join("")}<button class="choice" data-separate-account=""><b>건너뛰기</b></button></div></div></div>`;return `<div class="sheet-backdrop"><div class="sheet"><div class="sheet-head"><h2>${esc(name)}를 이미 등록하셨어요.</h2><button class="close" data-close>×</button></div><div class="dialog-actions"><button class="choice" data-duplicate="merge"><b>합치기</b><span>수량을 더합니다</span></button><button class="choice" data-duplicate="separate"><b>따로 두기</b><span>다른 계좌에 있는 경우</span></button></div></div></div>`;}const paths={maturityRange:["은행 앱","상품 › 보유상품 › 상품 상세 › 만기일","앱에 따라 ‘계약 만기일’로 표시됩니다."],interestRate:["은행 앱","상품 › 보유상품 › 상품 상세 › 적용 금리","앱에 따라 ‘약정이율’로 표시됩니다."],valuation:["금융사 앱","계좌 › 잔고 › 보유상품 › 평가금액","앱에 따라 ‘현재가치’ 또는 ‘잔고평가금액’으로 표시됩니다."],averagePrice:["증권사 앱","계좌 › 잔고 › 종목 상세 › 평균 매입단가","앱에 따라 ‘매입평균가’로 표시됩니다."],quantity:["보유 내역","자산 상세 › 보유 수량","실물은 보증서나 구매 내역의 중량을 확인하세요."],realestate:["부동산 정보","국토교통부 실거래가 공개시스템 또는 시세 화면","지역과 면적이 비슷한 최근 거래를 확인하세요."]},key=sheetState.group==="realestate"?"realestate":sheetState.target,info=paths[key]||paths.valuation;return `<div class="sheet-backdrop" data-backdrop><div class="sheet"><div class="sheet-head"><h2>${esc(sheetState.title)}</h2><button class="close" data-close>×</button></div><div class="path"><b>${info[0]}</b>${info[1]}<br>${info[2]}</div><button class="cant-find" data-estimate>그래도 못 찾겠어요 → 대략적인 값으로 입력</button></div></div>`;}
function captureUI(){return {open:[...document.querySelectorAll("details[open]")].map(node=>node.dataset.details).filter(Boolean),scrollY:window.scrollY};}
function render(){const ui=captureUI(),app=document.getElementById("app");app.innerHTML=(screen==="checklist"?checklist():screen==="input"?inputScreen():screen==="review"?review():done())+sheet();ui.open.forEach(id=>{const node=document.querySelector(`[data-details="${id}"]`);if(node)node.open=true;});bind();if(screen==="input")requestAnimationFrame(()=>window.scrollTo(0,Math.min(ui.scrollY,document.documentElement.scrollHeight)));}
function bindDynamic(root=document){root.querySelectorAll("[data-product]").forEach(button=>button.addEventListener("click",()=>chooseProduct(button.dataset.productGroup,button.dataset.product)));root.querySelectorAll("[data-direct]").forEach(button=>button.addEventListener("click",()=>{const group=button.dataset.direct;persistDraft(group,"directMode",!draft(group).fields.directMode);render();}));root.querySelectorAll("[data-currency]").forEach(button=>button.addEventListener("click",()=>{persistDraft("cash","currency",button.dataset.currency);render();}));}
function bind(){document.querySelectorAll("[data-group-check]").forEach(box=>box.addEventListener("change",()=>{session.selectedGroups=GROUPS.filter(group=>document.querySelector(`[data-group-check="${group.id}"]`)?.checked).map(group=>group.id);session.currentGroupIndex=Math.min(session.currentGroupIndex,Math.max(0,session.selectedGroups.length-1));saveNow();const start=document.querySelector("[data-start]");if(start)start.disabled=!session.selectedGroups.length;}));document.querySelector("[data-start]")?.addEventListener("click",()=>{session.currentGroupIndex=0;screen="input";resumeVisible=false;renderDirection="forward";saveNow();render();});document.querySelector("[data-resume]")?.addEventListener("click",()=>{screen="input";resumeVisible=false;render();});document.querySelector("[data-restart]")?.addEventListener("click",()=>{session=emptySession();saveNow();resumeVisible=false;render();});document.querySelectorAll("[data-field]").forEach(control=>{control.addEventListener("compositionstart",()=>composing.add(control));control.addEventListener("compositionend",()=>{composing.delete(control);handleInput(control);});control.addEventListener("input",()=>{if(!composing.has(control))handleInput(control);});control.addEventListener("change",()=>{if(control.dataset.field==="province"){persistDraft(control.dataset.group,"district","");render();}});control.addEventListener("focus",()=>{if(control.classList.contains("money"))control.value=moneyDigits(control.value);if(control.dataset.search){const query=control.value;renderSearchResults(control.dataset.search,query,{recentOnly:!query});}});control.addEventListener("blur",()=>{if(control.classList.contains("money"))control.value=comma(control.value);});});document.querySelectorAll("[data-chipset]").forEach(set=>set.querySelectorAll(".chip").forEach(chip=>chip.addEventListener("click",()=>{persistDraft(set.dataset.group,set.dataset.chipset,chip.dataset.value);render();})));document.querySelectorAll("[data-clear-field]").forEach(button=>button.addEventListener("click",()=>{persistDraft(button.dataset.group,button.dataset.clearField,"");render();}));document.querySelectorAll("[data-how]").forEach(button=>button.addEventListener("click",()=>{sheetState={group:button.closest(".field")?.querySelector("[data-group]")?.dataset.group||session.selectedGroups[session.currentGroupIndex],target:button.dataset.how,title:button.dataset.title};render();}));document.querySelectorAll("[data-unknown]").forEach(check=>check.addEventListener("change",()=>{const group=check.dataset.group,name=check.dataset.unknown,item=draft(group),input=document.getElementById(`field-${group}-${name}`);item.unknownFields[name]=check.checked;item.fields[name]=check.checked?null:(input?.value||"");item.touched[name]=true;if(input){input.disabled=check.checked;if(check.checked)input.value="";}scheduleSave();}));document.querySelectorAll("[data-toggle]").forEach(button=>button.addEventListener("click",()=>{persistDraft(button.dataset.group,button.dataset.toggle,button.getAttribute("aria-pressed")!=="true");render();}));document.querySelector("[data-currency-search]")?.addEventListener("focus",event=>renderCurrencyResults(event.currentTarget.value));document.querySelector("[data-currency-search]")?.addEventListener("input",event=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>renderCurrencyResults(event.currentTarget.value),250);});bindDynamic();document.querySelector("[data-next]")?.addEventListener("click",nextAction);document.querySelector("[data-add-another]")?.addEventListener("click",addAnother);document.querySelector("[data-back]")?.addEventListener("click",goBack);document.querySelector("[data-skip]")?.addEventListener("click",skipGroup);document.querySelectorAll("[data-remove]").forEach(button=>button.addEventListener("click",()=>{session.assets=session.assets.filter(asset=>asset.id!==button.dataset.remove);saveNow();render();}));document.querySelectorAll("[data-edit-asset]").forEach(button=>button.addEventListener("click",()=>editAsset(button.dataset.editAsset)));document.querySelectorAll("[data-review-edit]").forEach(button=>button.addEventListener("click",()=>editAsset(button.dataset.reviewEdit,true)));document.querySelectorAll("[data-review-group]").forEach(button=>button.addEventListener("click",()=>openGroup(button.dataset.reviewGroup)));document.querySelector("[data-complete]")?.addEventListener("click",()=>{session.completed=true;screen="done";saveNow();render();});document.querySelectorAll("[data-edit]").forEach(button=>button.addEventListener("click",()=>{session.completed=false;if(screen==="review"&&session.selectedGroups.length){const group=session.selectedGroups[0];session.currentGroupIndex=0;restoreLastAsset(group);screen="input";renderDirection="back";}else screen="review";saveNow();render();}));document.querySelector("[data-close]")?.addEventListener("click",closeSheet);document.querySelector("[data-backdrop]")?.addEventListener("click",event=>{if(event.target===event.currentTarget)closeSheet();});document.querySelector("[data-estimate]")?.addEventListener("click",enableEstimate);document.querySelectorAll("[data-pending]").forEach(button=>button.addEventListener("click",()=>resolvePending(button.dataset.pending)));document.querySelectorAll("[data-duplicate]").forEach(button=>button.addEventListener("click",()=>resolveDuplicate(button.dataset.duplicate)));document.querySelectorAll("[data-separate-account]").forEach(button=>button.addEventListener("click",()=>commitSeparate(button.dataset.separateAccount)));}
function handleInput(control){const group=control.dataset.group,name=control.dataset.field;let value=control.value;if(control.classList.contains("money"))value=moneyDigits(value);persistDraft(group,name,value);if(control.classList.contains("money")){const readback=document.querySelector(`[data-readback="${group}-${name}"]`);if(readback)readback.textContent=readMoney(value,currencyCode(group));}if(control.dataset.search){clearTimeout(searchTimer);searchTimer=setTimeout(()=>renderSearchResults(control.dataset.search,control.value),250);}}
function chooseProduct(group,code){const product=productByCode(group,code),item=draft(group);if(!product)return;item.fields.search=product.name;item.fields.productName=product.name;item.fields.productCode=product.code;item.touched.search=true;const map={equity:["currentPrice","currency","market","sector","country","etfType","underlying"],fund:["standardPrice","currency","fundType","region","hedge"],bond:["maturity","currency","bondType","rating","coupon","interestCycle"],crypto:["currentPrice","currency","category"]};item.autoFields=Object.fromEntries(map[group].filter(key=>product[key]!==undefined).map(key=>[key,product[key]]));refreshDerived(group);session.recentSearches=[{group,code},...session.recentSearches.filter(entry=>entry.code!==code)].slice(0,12);saveNow();render();}
function resolvePending(action){const group=sheetState.group,item=draft(group);sheetState=null;if(action==="discard"){session.drafts[group]=freshDraft(group);saveNow();return advance();}if(!requiredReady(group,item)){render();return toastHelp("작성 중인 항목의 필수 정보를 확인해주세요.");}commitAsset(group,item);advance();}
function closeSheet(){sheetState=null;duplicateState=null;render();}
function enableEstimate(){const group=sheetState.group,item=draft(group);item.estimatedFields[sheetState.target]=true;if(sheetState.target==="maturityRange"&&!item.fields.maturityRange)item.fields.maturityRange="1~3년";sheetState=null;saveNow();render();}
function resolveDuplicate(choice){const state=duplicateState;if(choice==="merge"){state.existing.fields.quantity=Number(state.existing.fields.quantity||0)+Number(state.newItem.fields.quantity||0);state.existing.updatedAt=new Date().toISOString();session.drafts[state.group]=freshDraft(state.group);duplicateState=null;saveNow();return state.after==="stay"?render():advance();}duplicateState.mode="account";render();}
function commitSeparate(accountType){const state=duplicateState;duplicateState=null;commitAsset(state.group,state.newItem,{accountType});state.after==="stay"?render():advance();}
function editAsset(id,fromReview=false){const asset=session.assets.find(entry=>entry.id===id);if(!asset)return;session.currentGroupIndex=session.selectedGroups.indexOf(asset.group);session.drafts[asset.group]={fields:Object.assign({},asset.fields),autoFields:Object.assign({},asset.autoFields),estimatedFields:asset.isEstimated?{restored:true}:{},touched:Object.fromEntries(Object.keys(asset.fields).map(key=>[key,true])),unknownFields:{},editingId:asset.id};screen="input";renderDirection=fromReview?"back":renderDirection;saveNow();render();}
function openGroup(group){session.currentGroupIndex=session.selectedGroups.indexOf(group);session.drafts[group]=freshDraft(group);screen="input";renderDirection="back";saveNow();render();}
function toastHelp(message){let note=document.querySelector(".validation-note");if(!note){note=document.createElement("div");note.className="inline-note validation-note";document.querySelector(".section")?.prepend(note);}note.textContent=message;note.scrollIntoView({behavior:"smooth",block:"center"});}
render();
  </script>
</body>
</html>
