function mergeTickerRows(rows){const merged=new Map([...TICKER_FALLBACK,...tickerStore.items].map(row=>[`${row.m}:${row.c}`,row]));rows.forEach(row=>{if(row?.c&&row?.n){row.c=String(row.c).toUpperCase();merged.set(`${row.m}:${row.c}`,Object.assign({},merged.get(`${row.m}:${row.c}`),row));}});tickerStore.items=[...merged.values()];tickerStore.byCode=new Map(tickerStore.items.map(row=>[row.c,tickerToProduct(row)]));}
async function loadTickerFile(scope){if(tickerStore.loaded.has(scope))return;if(tickerStore.loading.has(scope))return tickerStore.loading.get(scope);const task=(async()=>{try{const url=new URL(`data/tickers-${scope}.json`,document.baseURI),response=await fetch(url);if(!response.ok)throw new Error(`HTTP ${response.status}`);const rows=await response.json();if(!Array.isArray(rows)||!rows.length)throw new Error("파일이 비어 있습니다");mergeTickerRows(rows);tickerStore.loaded.add(scope);tickerStore.errors.delete(scope);}catch(error){tickerStore.errors.set(scope,error);console.error(`[종목 데이터] tickers-${scope}.json 로드 실패:`,error);if(scope==="kr")mergeTickerRows([]);}finally{tickerStore.loading.delete(scope);tickerStore.status=tickerStore.errors.has("kr")?"error":tickerStore.loaded.size?"ready":"loading";}})();tickerStore.loading.set(scope,task);return task;}
async function loadTickerData(){await loadTickerFile("kr");const input=document.querySelector('[data-search="equity"]');if(!input)return;input.placeholder="한글명 · 영문명 · 티커 · 초성";if(tickerStore.status==="error"){const field=input.closest(".search-field");if(field&&!field.querySelector("[data-ticker-load-error]")){const notice=document.createElement("div");notice.dataset.tickerLoadError="true";notice.innerHTML='<div class="empty-search">종목 목록을 불러오지 못했습니다</div><button type="button" class="direct-row" data-direct="equity">직접 등록</button>';field.appendChild(notice);bindDynamic(notice);}}}
function tickerScore(row,q){const code=row.c.toLowerCase(),names=[row.n,row.e||""].map(value=>value.toLowerCase()),chosung=initials(row.n).toLowerCase();if(code===q)return 0;if(code.startsWith(q))return 1;if(names.some(value=>value.startsWith(q)))return 2;if(chosung.startsWith(q))return 3;return [code,...names,chosung].some(value=>value.includes(q))?4:99;}
function marketPriority(market){if(["KOSPI","KOSDAQ","KONEX"].includes(market))return 0;if(["NASDAQ","NYSE","AMEX","NYSE Arca","BATS"].includes(market))return 1;return 2;}
async function searchTickers(query,{type,limit=20}={}){const q=String(query||"").trim().toLowerCase();if(!q)return[];const loads=[loadTickerFile("kr"),loadTickerFile("global")];if(/[a-z0-9]/i.test(q))loads.push(loadTickerFile("us"));await Promise.all(loads);return tickerStore.items.filter(row=>(!type||row.t===type||(type==="etf"&&row.t==="etn"))&&tickerScore(row,q)<99).sort((a,b)=>tickerScore(a,q)-tickerScore(b,q)||marketPriority(a.m)-marketPriority(b.m)||Number(b.x||0)-Number(a.x||0)||Number(a.r||999999)-Number(b.r||999999)).slice(0,limit).map(tickerToProduct);}
function lookupProducts(group,query){const source=MOCK.products[group]||[],q=String(query||"").trim().toLowerCase();if(!q)return[];return source.filter(product=>`${product.name} ${product.code} ${product.aliases||""} ${initials(product.name)}`.toLowerCase().includes(q)).slice(0,20);}
function productByCode(group,code){return group==="equity"?tickerStore.byCode.get(code)||tickerToProduct(TICKER_FALLBACK.find(row=>row.c===code)||{}):(MOCK.products[group]||[]).find(product=>product.code===code);}
function refreshDerived(group){const item=draft(group),fields=item.fields;if(group==="cash"){const rate=liveQuotes.rates[fields.currency]||1;item.autoFields=fields.currency==="KRW"?{}:{currency:fields.currency,exchangeRate:rate,krwValue:Math.round(Number(fields.amount||0)*rate)};}if(["equity","crypto"].includes(group)){const product=productByCode(group,fields.productCode),price=product?.currentPrice,quantity=Number(fields.quantity||0),average=Number(fields.averagePrice||0);if(quantity&&price){item.autoFields.valuation=roundedMoney(quantity*price,currencyCode(group,item));delete item.autoFields.priceUnavailable;}else{delete item.autoFields.valuation;if(quantity&&fields.productCode&&!price&&liveQuotes.status!=="loading")item.autoFields.priceUnavailable=true;else delete item.autoFields.priceUnavailable;}if(quantity&&average)item.autoFields.purchaseAmount=roundedMoney(quantity*average,currencyCode(group,item));else delete item.autoFields.purchaseAmount;}if(group==="commodity"){if(Number(fields.quantity)>0&&fields.holdingMethod!=="기타"){const unit=getQuantityUnit(fields.assetKind,fields.holdingMethod),grams=unit==="돈"?Number(fields.quantity)*3.75:Number(fields.quantity),price=fields.assetKind==="은"?liveQuotes.commodities.silverPerGram:liveQuotes.commodities.goldPerGram;if(price)item.autoFields={price,valuation:Math.round(grams*price),currency:"KRW"};else item.autoFields=liveQuotes.status==="loading"?{}:{priceUnavailable:true};}else item.autoFields={};}}

function label(text,opts={}){return `<div class="label-row"><span class="label">${text}${opts.estimated?'<span class="estimate-tag">추정</span>':""}</span><span class="label-actions">${opts.how?`<button type="button" class="how" data-how="${opts.target}" data-title="${opts.how}">확인 방법</button>`:""}${opts.optional?'<span class="optional-tag">선택</span>':""}</span></div>`;}
function inputField(group,name,title,opts={}){const item=draft(group),value=item.fields[name]??"",money=Boolean(opts.money),numericOnly=Boolean(opts.numeric)&&!money,currency=opts.currency||currencyCode(group,item),attrs=[`id="field-${group}-${name}"`,`data-field="${name}"`,`data-group="${group}"`,`class="control ${money?"money":numericOnly?"numeric":""}"`,`value="${esc(money&&document.activeElement?.id!==`field-${group}-${name}`?comma(value,currency):value)}"`,`placeholder="${esc(opts.placeholder||"")}"`,`type="${opts.type||"text"}"`];if(opts.numeric||money)attrs.push('inputmode="decimal"');if(money)attrs.push(`data-currency="${currency}"`);return `<div class="field">${label(title,{optional:opts.optional,estimated:Boolean(item.estimatedFields[name]),how:opts.how,target:name})}<input ${attrs.join(" ")}>${money?`<div class="readback" data-readback="${group}-${name}">${readMoney(value,currency)}</div>`:""}<div class="field-help" data-field-help="${group}-${name}"></div>${opts.help?`<div class="help"${opts.helpId?` data-help-id="${opts.helpId}"`:""}>${opts.help}</div>`:""}</div>`;}
function selectField(group,name,title,options,opts={}){const item=draft(group),value=item.fields[name]??"";return `<div class="field">${label(title,{optional:opts.optional,how:opts.how,target:name})}<select class="control" data-field="${name}" data-group="${group}">${opts.placeholder?`<option value="">${opts.placeholder}</option>`:""}${options.map(option=>{const valuePart=Array.isArray(option)?option[0]:option,labelPart=Array.isArray(option)?option[1]:option;return `<option value="${esc(valuePart)}" ${value===valuePart?"selected":""}>${esc(labelPart)}</option>`;}).join("")}</select>${opts.note?`<div class="inline-note">${opts.note}</div>`:""}</div>`;}
function chips(group,name,title,values,opts={}){const item=draft(group),value=item.fields[name]??"";return `<div class="field">${label(title,{optional:opts.optional,how:opts.how,target:name})}<div class="chips" data-chipset="${name}" data-group="${group}">${values.map(v=>`<button type="button" class="chip ${value===v?"active":""}" data-value="${esc(v)}">${esc(v)}</button>`).join("")}</div>${opts.clear?`<button type="button" class="clear-choice" data-clear-field="${name}" data-group="${group}">건너뛰기</button>`:""}${opts.help?`<div class="help">${opts.help}</div>`:""}</div>`;}
function displayDate(value){return /^\d{4}-\d{2}-\d{2}$/.test(value||"")?value.replace(/-/g,"."):"날짜 선택";}
function dateField(group,name,title,optional=true,{unknown=true}={}){const item=draft(group),isUnknown=Boolean(item.unknownFields[name]),value=isUnknown?"":item.fields[name]||"";return `<div class="field">${label(title,{optional})}<div class="row"><div class="date-control"><button type="button" class="date-display" data-open-date="${group}-${name}" aria-label="달력 열기" ${isUnknown?"disabled":""}><span data-date-text="${group}-${name}">${displayDate(value)}</span><svg class="calendar-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 2v3M17 2v3M3 9h18M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/></svg></button><input id="field-${group}-${name}" class="native-date" type="date" data-field="${name}" data-group="${group}" value="${esc(value)}" ${isUnknown?"disabled":""}></div>${unknown?`<label class="unknown-wrap"><input type="checkbox" data-unknown="${name}" data-group="${group}" ${isUnknown?"checked":""}>모름</label>`:""}</div><div class="field-help" data-field-help="${group}-${name}"></div></div>`;}
function optionalSection(group,count,names,body){return `<details class="optional" data-details="optional-${group}"><summary class="optional-summary"><span><b>＋ 선택 정보 입력하기</b><small>${names.join(" · ")}</small></span><span>${count}개⌄</span></summary><div class="optional-body">${body}</div></details>`;}
function searchField(group,title,placeholder){const query=draft(group).fields.search||"",loading=group==="equity"&&tickerStore.status==="loading",failed=group==="equity"&&tickerStore.status==="error";return `<div class="field search-field">${label(title)}<div class="search-anchor"><input id="field-${group}-search" class="control" data-search="${group}" data-field="search" data-group="${group}" value="${esc(query)}" placeholder="${loading?"종목 목록을 불러오는 중":placeholder}" autocomplete="off"><div class="search-host" data-search-host="${group}" hidden></div></div>${failed?'<div class="empty-search">종목 목록을 불러오지 못했습니다</div><button type="button" class="direct-row" data-direct="equity">직접 등록</button>':""}<div class="field-help" data-field-help="${group}-search"></div></div>`;}
function searchResult(group,product){let info=product.code,displayName=product.name,badge="";if(group==="equity"){displayName=product.englishName&&!/[가-힣]/.test(product.name)?product.englishName:product.englishName&&!["KOSPI","KOSDAQ","KONEX"].includes(product.market)?`${product.englishName} (${product.name})`:product.name;info=`${product.code} · ${product.market}`;if(["etf","etn"].includes(product.type))badge=`<span class="ticker-type">${product.type.toUpperCase()}</span>`;}if(group==="fund")info=`${product.fundType} · ${product.region} · ${product.hedge} · ${product.code}`;if(group==="bond")info=`${product.maturity.slice(0,4)}년 ${product.maturity.slice(5)}월 만기 · 표면 ${product.coupon}<br><span>${product.code}</span>`;const name=group==="equity"?`<span class="ticker-main"><span class="ticker-name">${esc(displayName)}</span>${badge}</span>`:`<b>${esc(displayName)}</b>`;return `<button type="button" class="search-result" data-product="${esc(product.code)}" data-product-group="${group}">${name}<small>${info}</small></button>`;}
function directLabel(group){return {equity:"찾는 종목이 없어요 → 직접 등록",fund:"찾는 펀드가 없어요 → 직접 등록",bond:"찾는 채권이 없어요 → 직접 등록"}[group]||"";}
async function renderSearchResults(group,query,{recentOnly=false}={}){const host=document.querySelector(`[data-search-host="${group}"]`);if(!host)return;const requestId=++searchRequestId,q=String(query||"").trim();if(group==="equity"&&!q){host.hidden=true;host.innerHTML="";return;}if(group==="equity"&&/[a-z0-9]/i.test(q)&&(!tickerStore.loaded.has("us")||!tickerStore.loaded.has("global"))){host.hidden=false;host.innerHTML='<div class="empty-search">종목을 불러오는 중</div>';}let products=[];if(group==="equity")products=await searchTickers(q,{type:tickerFilter==="all"?undefined:tickerFilter,limit:20});else if(recentOnly){const codes=session.recentSearches.filter(item=>item.group===group).map(item=>item.code);products=codes.map(code=>productByCode(group,code)).filter(Boolean);if(!products.length){host.hidden=true;host.innerHTML="";return;}}else products=lookupProducts(group,q);if(requestId!==searchRequestId)return;const filters=group==="equity"?`<div class="ticker-filters">${[["all","전체"],["stock","주식"],["etf","ETF"]].map(([value,text])=>`<button type="button" class="ticker-filter ${tickerFilter===value?"active":""}" data-ticker-filter="${value}">${text}</button>`).join("")}</div>`:"";host.hidden=false;host.innerHTML=filters+(products.length?(recentOnly?'<div class="search-caption">최근 검색</div>':"")+products.map(product=>searchResult(group,product)).join(""):`<div class="empty-search">검색 결과가 없습니다.</div>`)+(!recentOnly&&q&&directLabel(group)?`<button type="button" class="direct-row" data-direct="${group}">${directLabel(group)}</button>`:"");bindDynamic(host);positionOverlay(host);}
function currencyLabel(currency){return `${currency.code} · ${currency.ko}`;}
function currencyPicker(){const item=draft("cash"),selected=CURRENCIES.find(row=>row.code===item.fields.currency)||CURRENCIES[0];return `<div class="field currency-field">${label("통화")}<div class="currency-anchor"><input id="field-cash-currencySearch" class="control" data-currency-search value="${esc(currencyLabel(selected))}" placeholder="통화명 · 영문명 · 코드 검색" autocomplete="off" role="combobox" aria-expanded="false"><div class="currency-menu" data-currency-host hidden></div></div></div>`;}
function currencyMatchScore(currency,q){const code=currency.code.toLowerCase(),values=[currency.ko,currency.en,currency.country].map(value=>value.toLowerCase());if(code===q)return 0;if(code.startsWith(q))return 1;if(values.some(value=>value.startsWith(q)))return 2;return [code,...values].some(value=>value.includes(q))?3:99;}
function positionOverlay(host){host.classList.remove("open-up");requestAnimationFrame(()=>{if(host.hidden)return;const anchor=host.parentElement.getBoundingClientRect(),sticky=document.querySelector(".sticky-actions")?.getBoundingClientRect(),floor=sticky&&sticky.top<window.innerHeight?sticky.top:window.innerHeight,maxHeight=parseFloat(getComputedStyle(host).maxHeight)||host.scrollHeight,needed=Math.min(host.scrollHeight,maxHeight),below=floor-anchor.bottom,above=anchor.top;if(below<needed&&above>below)host.classList.add("open-up");});}
function renderCurrencyResults(query="",{frequent=false}={}){const host=document.querySelector("[data-currency-host]"),input=document.querySelector("[data-currency-search]");if(!host||!input)return;const q=String(query||"").trim().toLowerCase(),rows=frequent?CURRENCIES.slice(0,5):CURRENCIES.filter(currency=>currencyMatchScore(currency,q)<99).sort((a,b)=>currencyMatchScore(a,q)-currencyMatchScore(b,q)||a.rank-b.rank);host.hidden=false;input.setAttribute("aria-expanded","true");host.innerHTML=(frequent?'<div class="search-caption">자주 쓰는 통화</div>':"")+(rows.length?rows.map(currency=>`<button type="button" class="search-result" data-currency-option="${currency.code}"><b>${currencyLabel(currency)}</b><small>${currency.en} · ${currency.country}</small></button>`).join(""):'<div class="empty-search">검색 결과가 없습니다.</div>');bindDynamic(host);positionOverlay(host);}
function moneyLabel(value,currency){const number=roundedMoney(value,currency),options={minimumFractionDigits:0,maximumFractionDigits:currencyDecimals(currency)};if(currency==="KRW")return `${number.toLocaleString("ko-KR",options)}원`;const symbol=CURRENCIES.find(item=>item.code===currency)?.symbol||currency;return `${symbol}${number.toLocaleString("ko-KR",options)}`;}
function valuationText(group){const item=draft(group),value=Number(item.autoFields?.valuation||0);if(!value)return"";const currency=currencyCode(group,item),krw=Math.round(value*(liveQuotes.rates[currency]||1)),asOf=quotesAsOfLabel();return `평가금액 ${moneyLabel(value,currency)}${currency!=="KRW"?` (약 ${krw.toLocaleString("ko-KR")}원)`:""}${asOf?` · ${asOf}`:""}`;}
// null이면 valuationLine 컨테이너 자체를 렌더하지 않는다(아직 계산 대상이 아님).
// 문자열이면 "확인 중"/"확인 불가" 안내이거나 실제 valuationText 결과다 — 이 구분이
// handleInput()의 실시간 갱신에서도 그대로 재사용된다.
function valuationLineContent(group){
  const item=draft(group);
  if(["equity","crypto"].includes(group)){
    if(!item.fields.productCode)return null;
    if(productByCode(group,item.fields.productCode)?.currentPrice)return valuationText(group);
    return liveQuotes.status==="loading"?"시세 확인 중...":"시세 확인 불가 · 평가금액·총자산 계산에서 제외됩니다";
  }
  if(group==="commodity"){
    if(!(item.fields.assetKind&&item.fields.holdingMethod&&item.fields.holdingMethod!=="기타"))return null;
    const price=item.fields.assetKind==="은"?liveQuotes.commodities.silverPerGram:liveQuotes.commodities.goldPerGram;
    if(price)return valuationText(group);
    return liveQuotes.status==="loading"?"시세 확인 중...":"시세 확인 불가 · 평가금액·총자산 계산에서 제외됩니다";
  }
  return null;
}
function valuationLine(group){const content=valuationLineContent(group);return content!==null?`<div class="valuation-line" data-valuation-line="${group}">${content}</div>`:"";}
function cashFxLine(){const item=draft("cash"),currency=item.fields.currency||"KRW",amount=roundedMoney(item.fields.amount,currency),rate=liveQuotes.rates[currency]||1;if(currency==="KRW")return"";return `<div class="valuation-line" data-cash-fx>${amount?`${currency} ${amount.toLocaleString("ko-KR",{maximumFractionDigits:currencyDecimals(currency)})} · 약 ${Math.round(amount*rate).toLocaleString("ko-KR")}원 (${rate.toLocaleString("ko-KR")}원 기준)`:""}</div>`;}
function formatAuto(key,value,currency="KRW"){return ["currentPrice","valuation","purchaseAmount","standardPrice","price"].includes(key)&&Number.isFinite(Number(value))?`${currency==="KRW"?"":currency+" "}${Number(value).toLocaleString("ko-KR")}${currency==="KRW"&&key!=="standardPrice"?"원":""}`:value;}

function checklist(){return `<div class="view"><h1>어떤 자산을 등록할까요?</h1>${resumeVisible?resumeCard():""}<div class="group-list">${GROUPS.map(group=>`<label class="group-option"><input type="checkbox" data-group-check="${group.id}" ${session.selectedGroups.includes(group.id)?"checked":""}><b>${group.name}</b></label>`).join("")}</div><div class="sticky-actions"><button class="btn primary" data-start ${session.selectedGroups.length?"":"disabled"}>입력 시작하기</button></div><p class="trust-line">계좌를 연결하지 않습니다. 직접 입력한 정보만 사용합니다.</p></div>`;}

function cash(){const g="cash",item=draft(g),currency=item.fields.currency||"KRW";return `${currencyPicker()}<div data-cash-amount-block>${inputField(g,"amount","금액",{money:true,numeric:true,currency})}${cashFxLine()}</div>${chips(g,"purpose","용도",["생활비","투자 대기","비상금"],{optional:true})}`;}
function getHoldingMethods(assetType){return {금:["KRX 금시장","금통장","실물 보유"],은:["은통장","실물 보유"],"기타 귀금속":["실물 보유","기타"],"원유/에너지":["기타"],"기타 원자재":["기타"]}[assetType]||[];}

function bindFieldControls(root=document){root.querySelectorAll("input[data-field],select[data-field]").forEach(control=>{control.addEventListener("compositionstart",()=>composing.add(control));control.addEventListener("compositionend",()=>{composing.delete(control);handleInput(control);});control.addEventListener("beforeinput",event=>{if(!(control.classList.contains("money")||control.classList.contains("numeric"))||event.inputType.startsWith("delete")||event.data==null)return;const start=control.selectionStart??control.value.length,end=control.selectionEnd??start,next=control.value.slice(0,start)+event.data+control.value.slice(end);if(digitsForControl(control,next)!==next)event.preventDefault();});control.addEventListener("input",()=>{if(!composing.has(control))handleInput(control);});control.addEventListener("change",()=>{if(control.dataset.field==="province"){persistDraft(control.dataset.group,"district","");refreshDistrictField(control.dataset.group);}else if(control.type==="date"){const text=document.querySelector(`[data-date-text="${control.dataset.group}-${control.dataset.field}"]`);if(text)text.textContent=displayDate(control.value);}});control.addEventListener("focus",()=>{if(control.classList.contains("money"))control.value=moneyDigits(control.value,control.dataset.currency||currencyCode(control.dataset.group));if(control.dataset.search){const query=control.value;renderSearchResults(control.dataset.search,query,{recentOnly:control.dataset.search!=="equity"&&!query});}});control.addEventListener("blur",()=>{if(control.classList.contains("money")){control.value=comma(control.value,control.dataset.currency||currencyCode(control.dataset.group));}else if(control.dataset.group==="realestate"&&control.dataset.field==="ownershipRate"){const num=Number(control.value);if(Number.isFinite(num)&&num>100){control.value="100";persistDraft("realestate","ownershipRate","100");}}});});root.querySelectorAll("div[data-chipset]").forEach(set=>set.querySelectorAll(".chip").forE function bind(){document.querySelectorAll("input[data-group-check]").forEach(box=>box.addEventListener("change",()=>{session.selectedGroups=GROUPS.filter(group=>document.querySelector(`[data-group-check="${group.id}"]`)?.checked).map(group=>group.id);session.currentGroupIndex=Math.min(session.currentGroupIndex,Math.max(0,session.selectedGroups.length-1));saveNow();const start=document.querySelector("[data-start]");if(start)start.disabled=!session.selectedGroups.length;}));document.querySelector("button[data-start]")?.addEventListener("click",()=>{session.currentGroupIndex=0;screen="input";resumeVisible=false;renderDirection="forward";saveNow();render();});document.querySelector("button[data-resume]")?.addEventListener("click",()=>{screen="input";resumeVisible=false;render();});document.querySelector("button[data-restart]")?.addEventListener("click",()=>{session=emptySession();saveNow();resumeVisible=false;render();});bindFieldControls(document);const currencyInput=document.querySelector("input[data-currency-search]");currencyInput?.addEventListener("focus",event=>{event.currentTarget.setSelectionRange(0,event.currentTarget.value.length);renderCurrencyResults("",{frequent:true});});currencyInput?.addEventListener("input",event=>{clearTimeout(currencyTimer);currencyTimer=setTimeout(()=>renderCurrencyResults(event.currentTarget.value),200);});bindDynamic();document.querySelector("button[data-next]")?.addEventListener("click",nextAction);document.querySelector("button[data-add-another]")?.addEventListener("click",addAnother);document.querySelector("button[data-back]")?.addEventListener("click",goBack);document.querySelector("button[data-skip]")?.addEventListener("click",skipGroup);document.querySelectorAll("button[data-remove]").forEach(button=>button.addEventListener("click",()=>removeAsset(button.dataset.remove)));document.querySelectorAll("button[data-edit-asset]").forEach(button=>button.addEventListener("click",()=>editAsset(button.dataset.editAsset)));document.quer function handleInput(control){const group=control.dataset.group,name=control.dataset.field,currency=control.dataset.currency||currencyCode(group);let value=control.value;if(control.classList.contains("money")||control.classList.contains("numeric")){const sanitized=digitsForControl(control,value);if(sanitized!==value)control.value=sanitized;value=sanitized;}persistDraft(group,name,value);if(control.classList.contains("money")){const readback=document.querySelector(`[data-readback="${group}-${name}"]`);if(readback)readback.textContent=readMoney(value,currency);}if(control.type==="date"){const text=document.querySelector(`[data-date-text="${group}-${name}"]`);if(text)text.textContent=displayDate(value);}const valuation=document.querySelector(`[data-valuation-line="${group}"]`);if(valuation)valuation.textContent=valuationLineContent(group)||"";const fx=document.querySelector("[data-cash-fx]");if(group==="cash"&&fx){const item=draft("cash"),cashCurrency=item.fields.currency||"KRW",amount=roundedMoney(item.fields.amount,cashCurrency),rate=liveQuotes.rates[cashCurrency]||1;fx.textContent=amount?`${cashCurrency} ${amount.toLocaleString("ko-KR",{maximumFractionDigits:currencyDecimals(cashCurrency)})} · 약 ${Math.round(amount*rate).toLocaleString("ko-KR")}원 (${rate.toLocaleString("ko-KR")}원 기준)`:"";}updateNextState();if(control.dataset.search){clearTimeout(searchTimer);const query=control.value;searchTimer=setTimeout(()=>renderSearchResults(control.dataset.search,query),250);}}

function removeAsset(id){const index=session.assets.findIndex(asset=>asset.id===id);if(index<0)return;const [removed]=session.assets.splice(index,1);if(draft(removed.group).editingId===id)workingDrafts[removed.group]=freshDraft(removed.group);saveNow();render();showToast(`${groupName(removed.group)} 1건을 삭제했어요`,()=>{session.assets.splice(Math.min(index,session.assets.length),0,removed);saveNow();});}

function resolveDuplicate(choice){const state=duplicateState;if(choice==="merge"){state.existing.fields.quantity=Number(state.existing.fields.quantity||0)+Number(state.newItem.fields.quantity||0);state.existing.updatedAt=new Date().toISOString();discardDraft(state.group);duplicateState=null;saveNow();if(state.after==="stay"){workingDrafts[state.group]=freshDraft(state.group);render();showToast(`${groupName(state.group)} 자산을 합쳤어요`);requestAnimationFrame(()=>firstFormControl(state.group)?.focus());return;}advance();return;}duplicateState.mode="account";render();}
function commitSeparate(accountType){const state=duplicateState;duplicateState=null;commitAsset(state.group,state.newItem,{accountType});if(state.after==="stay"){workingDrafts[state.group]=freshDraft(state.group);render();showToast(`${groupName(state.group)} 1건을 등록했어요`);requestAnimationFrame(()=>firstFormControl(state.group)?.focus());}else advance();}
function editAsset(id,fromReview=false){const asset=session.assets.find(entry=>entry.id===id);if(!asset)return;session.currentGroupIndex=session.selectedGroups.indexOf(asset.group);workingDrafts[asset.group]={fields:Object.assign({},asset.fields),autoFields:Object.assign({},asset.autoFields),estimatedFields:asset.isEstimated?{restored:true}:{},touched:{},unknownFields:{},editingId:asset.id,isDirty:false};delete session.drafts[asset.group];screen="input";renderDirection=fromReview?"back":renderDirection;saveNow();render();}
function openGroup(group){session.currentGroupIndex=session.selectedGroups.indexOf(group);restoreLastAsset(group);screen="input";renderDirection="back";saveNow();render();}
function toastHelp(message){let note=document.querySelector(".validation-note");if(!note){note=document.createElement("div");note.className="inline-note validation-note";document.querySelector(".section")?.prepend(note);}note.textContent=message;note.scrollIntoView({behavior:"smooth",block:"center"});}
document.addEventListener("beforeinput",event=>{const control=event.target;if(!control.matches?.(".money,.numeric"))return;if(event.data!=null&&String(event.data).length>1){event.stopImmediatePropagation();return;}if(control.classList.contains("money")&&handleMoneyBeforeInput(control,event))event.stopImmediatePropagation();},true);
document.addEventListener("focusin",event=>{if(event.target.matches?.(".money"))moneyEntryState.set(event.target,{fractionBlocked:false});},true);
document.addEventListener("focusout",event=>{if(event.target.matches?.(".money"))moneyEntryState.delete(event.target);},true);
document.addEventListener("change",event=>{if(event.target.matches?.('select[data-field="province"]')){persistDraft(event.target.dataset.group,"province",event.target.value);persistDraft(event.target.dataset.group,"district","");}if(!event.target.matches?.("input[data-unknown]"))return;const group=event.target.dataset.group,item=draft(group);item.isDirty=true;session.drafts[group]=item;scheduleSave();},true);
document.addEventListener("click",event=>{if(!event.target.matches?.("button[data-restart]"))return;Object.keys(workingDrafts).forEach(group=>delete workingDrafts[group]);},true);
document.addEventListener("click",event=>{document.querySelectorAll(".search-host:not([hidden]),.currency-menu:not([hidden])").forEach(host=>{if(host.contains(event.target))return;const anchor=host.closest(".search-anchor,.currency-anchor");if(anchor&&anchor.contains(event.target))return;host.hidden=true;host.innerHTML="";});});
document.addEventListener("input",event=>{if(!event.target.matches?.("input[data-currency-search]"))return;const query=event.target.value;clearTimeout(currencyTimer);currencyTimer=setTimeout(()=>renderCurrencyResults(query),200);});
document.addEventListener("input",event=>{if(!event.target.matches?.('[data-group="commodity"][data-field="quantity"]'))return;const item=draft("commodity"),note=document.querySelector('[data-help-id="gold-conversion"]');if(!note)return;const quantity=Number(item.fields.quantity||0);note.textContent=quantity?`${quantity.toLocaleString("ko-KR")}돈 · ${(quantity*3.75).toLocaleString("ko-KR")}g`:"1돈은 3.75g입니다.";});
mergeTickerRows([]);
loadTickerData();
loadQuotesData();
render();
  </script>
</body>
</html>
