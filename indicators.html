<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>경제지표</title>
  <!-- 폰트는 렌더를 막지 않게 받는다. 도착 전에는 폴백으로 읽히고 도착하면 바뀐다. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="lib/app.css?v=20260813-1">
  <script src="lib/supabase-config.js?v=20260811-1"></script>
  <script src="lib/account-store.js"></script>
  <script src="lib/auth-guard.js"></script>
  <style>
    /* 1차 묶음은 국가다 — 들어오면 나라가 먼저 보이고 그 안에 지표가 있다. */
    .search-row { display:flex; align-items:center; gap:var(--space-3); margin-bottom:var(--space-5); }
    .search-box { flex:1; min-width:0; min-height:2.75rem; padding:0 var(--space-4);
      border:var(--border) solid var(--line); border-radius:var(--radius-md);
      background:var(--surface); color:var(--ink); font-size:var(--font-md); }
    .search-box:focus { border-color:var(--brand); outline:.1875rem solid var(--brand-soft); }
    .search-count { flex:none; color:var(--muted); font-size:var(--font-sm); }
    .country-card { margin-bottom:var(--space-4); }
    .country-head { display:flex; align-items:baseline; gap:var(--space-2); margin-bottom:var(--space-3); }
    .country-head h2 { margin:0; }
    .country-head .en { color:var(--dim); font-size:var(--font-xs); }
    .ind-grid { display:grid; gap:var(--space-3); grid-template-columns:repeat(auto-fill,minmax(15rem,1fr)); }
    .ind-cell { padding:var(--space-4); border:var(--border) solid var(--line); border-radius:var(--radius-md); background:var(--surface-2); }
    .ind-name { color:var(--muted); font-size:var(--font-xs); }
    .ind-value { margin:var(--space-2) 0 var(--space-1); font-size:var(--font-lg); font-weight:800; font-variant-numeric:tabular-nums; }
    .ind-unit { color:var(--dim); font-size:var(--font-xs); }
    /* 관측 기간은 값과 반드시 함께 나간다. 3개월 전 값은 낡은 게 아니라 그 시점의 값이고,
       기간을 안 적으면 사용자가 언제 값인지 추측해야 한다. */
    .ind-period { display:flex; align-items:center; gap:var(--space-2); margin-top:var(--space-2); }
    .ind-period .pill { background:var(--surface); }
    .empty-search { padding:var(--space-8); color:var(--muted); font-size:var(--font-md); text-align:center; }
    .sources { margin-top:var(--space-6); color:var(--dim); font-size:var(--font-xs); line-height:1.8; }
  </style>
</head>
<body>
<div id="app"></div>
<script src="lib/session.js"></script>
<script src="lib/shell.js?v=20260813-2"></script>
<script src="lib/format.js"></script>
<script src="lib/indicators-view.js"></script>
<script>
const { escapeHtml } = Format;
let query="";

function navOptions(){
  const state=SessionStore.read();
  return {assetCounts:Shell.countByGroup(state.assets)};
}

// 데이터가 없거나 지나치게 낡았으면 빈 화면이 아니라 무엇이 없는지 말한다.
function problemPanel(title,detail){
  return `<div class="card">
    <h2>${escapeHtml(title)} <span class="pill warn">확인 필요</span></h2>
    <p class="soon-body" style="margin-top:var(--space-3)">${detail}</p>
    <div class="card-note">배치: <code>node scripts/build-indicators.mjs</code> · 산출물: data/indicators/catalog.json</div>
  </div>`;
}

function head(){
  return `<div class="page-head">
    <div><h1>경제지표</h1><div class="sub">OECD 회원국 주요 지표 · 국가별로 모아 봅니다</div></div>
  </div>`;
}

function sourcesLine(){
  const stale=Indicators.staleness();
  const updated=Indicators.state.data?.updatedAt;
  return `<div class="sources">출처: ${escapeHtml(Indicators.attribution())}
    ${updated?`<br>수집 시각 ${escapeHtml(String(updated).slice(0,10))} · 가장 최신 관측 ${escapeHtml(stale?stale.newest:"–")}`:""}</div>`;
}

function render(){
  const state=Indicators.state;

  if(state.status==="loading"){
    const bar=(w)=>`<span class="skel" style="width:${w}"></span>`;
    Shell.mount("app","indicators",`${head()}<div class="card">${bar("60%")}${bar("80%")}${bar("40%")}</div>`,navOptions());
    return;
  }
  if(state.status==="error"){
    Shell.mount("app","indicators",`${head()}${problemPanel("경제지표를 불러오지 못했어요",
      `<b>data/indicators/catalog.json</b>을 읽지 못했습니다 (${escapeHtml(state.error||"원인 미상")}).<br>
       파일이 배포에 포함됐는지, 배치가 한 번이라도 성공했는지 확인하세요.`)}`,navOptions());
    return;
  }
  if(state.status==="empty"){
    Shell.mount("app","indicators",`${head()}${problemPanel("경제지표 데이터가 비어 있어요",
      `<b>catalog.json</b>은 있지만 계열이 하나도 없습니다.<br>
       배치가 실패한 채로 파일만 남았을 수 있습니다.`)}`,navOptions());
    return;
  }

  const stale=Indicators.staleness();
  const staleBanner=stale&&stale.stale
    ?problemPanel("경제지표가 오래됐어요",
      `가장 최신 관측이 <b>${escapeHtml(stale.newest)}</b>로 ${stale.monthsBehind}개월 전입니다(기준 ${Indicators.STALE_MONTHS}개월).<br>
       월간 지표는 한두 달 늦는 게 정상이지만, 이 정도면 배치가 멈췄는지 확인해야 합니다.`)
    :"";

  const failures=Indicators.state.data?.failures||[];
  const failureNote=failures.length
    ?`<div class="banner">지난 수집에서 ${failures.length}건이 실패했어요 · ${escapeHtml(failures.map(f=>`${f.dataflow||f.indicator}: ${f.message}`).join(" / ").slice(0,220))}</div>`
    :"";

  const view=searchView(query);

  Shell.mount("app","indicators",[
    head(),
    staleBanner,
    failureNote,
    `<div class="search-row">
      <input class="search-box" type="search" placeholder="지표명 · 국가명 검색 (한글/영문)" value="${escapeHtml(query)}" data-search aria-label="지표 검색">
      <span class="search-count" data-search-count>${view.shown.toLocaleString("ko-KR")} / ${view.total.toLocaleString("ko-KR")}건</span>
    </div>`,
    `<div data-search-results>${view.body}</div>`,
    sourcesLine(),
  ].join(""),navOptions());
  bind();
}

// 검색할 때 입력칸까지 다시 만들면 한글 IME가 조합 중인 글자를 잃는다.
// 검색 결과와 건수만 교체해 입력 DOM·포커스·커서를 그대로 보존한다.
function searchView(value){
  const groups=Indicators.byCountry(value);
  const total=Indicators.all().length;
  const shown=groups.reduce((sum,group)=>sum+group.rows.length,0);
  const body=groups.length
    ?groups.map(group=>`<div class="card country-card">
        <div class="country-head"><h2>${escapeHtml(group.countryKo)}</h2><span class="en">${escapeHtml(group.countryEn)}</span></div>
        <div class="ind-grid">${group.rows.map(cell).join("")}</div>
      </div>`).join("")
    :`<div class="card"><p class="empty-search">"${escapeHtml(value)}"에 해당하는 지표가 없어요.<br>
        지표명이나 국가명을 한글·영문 어느 쪽으로 입력해도 찾을 수 있습니다.</p></div>`;
  return {body,total,shown};
}

function updateSearchResults(){
  const results=document.querySelector("[data-search-results]");
  const count=document.querySelector("[data-search-count]");
  if(!results||!count)return;
  const view=searchView(query);
  results.innerHTML=view.body;
  count.textContent=`${view.shown.toLocaleString("ko-KR")} / ${view.total.toLocaleString("ko-KR")}건`;
}

function cell(row){
  return `<div class="ind-cell">
    <div class="ind-name">${escapeHtml(row.indicatorKo)}</div>
    <div class="ind-value">${escapeHtml(Indicators.formatValue(row))}</div>
    <div class="ind-unit">${escapeHtml(row.unitKo)}</div>
    <div class="ind-period">
      <span class="pill">${escapeHtml(row.periodKo)} 기준</span>
      <span class="pill">${escapeHtml(row.freqKo)}</span>
    </div>
  </div>`;
}

function bind(){
  const box=document.querySelector("[data-search]");
  if(!box)return;
  box.addEventListener("input",event=>{
    query=event.target.value;
    updateSearchResults();
  });
}

render();
Indicators.load().then(render);
</script>
</body>
</html>
