# ⚠️ 임시 진단용 워크플로 — Track 35. 원인이 확정되면 **삭제한다.**
#
# quotes.yml이 2026-08-30부터 매 실행 UND_ERR_CONNECT_TIMEOUT으로 죽는다.
# "data.go.kr이 해외 IP를 막는다"는 해석은 그럴듯하지만 확인된 바 없고, 그 해석의
# 처방(자체 호스팅 러너·프록시·자동화 포기)은 전부 비싸다. 더 싼 설명 — 막힌 게
# 아니라 느릴 뿐이고 연결 타임아웃 10초가 모자란 것 — 이 배제되지 않았다.
#
# 이 워크플로는 그 둘을 가른다. 아무것도 고치지 않고, data/를 쓰지 않고,
# 커밋하지 않고, 인증키도 쓰지 않는다(연결 성립 여부만 보면 되므로).
name: "[임시] 네트워크 진단 (Track 35)"

on:
  workflow_dispatch: {}

# 읽기만 한다. 이 워크플로가 저장소에 무언가 쓸 이유가 없다.
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 러너의 공인 IP와 지역
        run: |
          echo "--- ipinfo.io ---"
          curl -s --max-time 20 https://ipinfo.io/json || echo "(ipinfo 실패)"
          echo
          echo "--- ifconfig.me (대조) ---"
          curl -s --max-time 20 https://ifconfig.me || echo "(ifconfig 실패)"
          echo
          echo "RUNNER_OS=$RUNNER_OS RUNNER_ARCH=$RUNNER_ARCH"

      - name: 진단 스크립트 작성 (저장소에 남기지 않는다)
        run: |
          cat > /tmp/probe.mjs <<'PROBE'
          // DNS · TCP · TLS · HTTP를 각각 따로 재고 경과 시간을 남긴다.
          // 층을 나누는 이유: DNS 실패와 연결 실패는 전혀 다른 문제인데
          // fetch의 "fetch failed" 한 줄로는 구별되지 않는다.
          import { lookup, resolve4 } from "node:dns/promises";
          import net from "node:net";
          import tls from "node:tls";

          const HOSTS = [
            ["apis.data.go.kr",     "실패 중인 바로 그 호스트"],
            ["www.data.go.kr",      "같은 기관, 다른 호스트"],
            ["opendart.fss.or.kr",  "금감원 — 다른 배치에서 동작 확인됨"],
            ["ecos.bok.or.kr",      "한국은행"],
            ["www.koreaexim.go.kr", "수출입은행"],
            ["www.naver.com",       "한국 상용 (대조군)"],
          ];

          const ms = (t) => `${((Date.now() - t) / 1000).toFixed(1)}초`;

          async function dnsProbe(host) {
            const t = Date.now();
            try {
              const a = await lookup(host);
              let all = [];
              try { all = await resolve4(host); } catch {}
              return `OK ${ms(t)} -> ${a.address}${all.length > 1 ? ` (A레코드 ${all.length}개)` : ""}`;
            } catch (e) { return `실패 ${ms(t)} -> ${e.code || e.message}`; }
          }

          // undici를 거치지 않는다. fetch로는 60초 연결 시험을 할 수 없다 —
          // undici의 자체 connect timeout(10초)이 먼저 터지기 때문이다.
          function tcpProbe(host, port, timeoutMs) {
            const t = Date.now();
            return new Promise((done) => {
              const s = net.connect({ host, port });
              s.setTimeout(timeoutMs);
              s.once("connect", () => { s.destroy(); done(`OK ${ms(t)}`); });
              s.once("timeout", () => { s.destroy(); done(`타임아웃 ${ms(t)} (한도 ${timeoutMs / 1000}초)`); });
              s.once("error", (e) => { s.destroy(); done(`실패 ${ms(t)} -> ${e.code || e.message}`); });
            });
          }

          function tlsProbe(host, timeoutMs) {
            const t = Date.now();
            return new Promise((done) => {
              const s = tls.connect({ host, port: 443, servername: host });
              s.setTimeout(timeoutMs);
              s.once("secureConnect", () => { const p = s.getProtocol(); s.destroy(); done(`OK ${ms(t)} (${p})`); });
              s.once("timeout", () => { s.destroy(); done(`타임아웃 ${ms(t)} (한도 ${timeoutMs / 1000}초)`); });
              s.once("error", (e) => { s.destroy(); done(`실패 ${ms(t)} -> ${e.code || e.message}`); });
            });
          }

          // 배치가 실제로 쓰는 경로. 인증키는 넣지 않는다 — 연결만 보면 되고,
          // 키가 없으면 오류 본문이 오는데 그것도 "연결됐다"는 증거다.
          async function fetchProbe(label, url, signal) {
            const t = Date.now();
            try {
              const r = await fetch(url, { signal, headers: { "User-Agent": "AssetInputBeta net-probe" } });
              const body = (await r.text()).slice(0, 120).replace(/\s+/g, " ");
              return `${label}: 응답 ${r.status} ${ms(t)} — ${body}`;
            } catch (e) {
              return `${label}: 실패 ${ms(t)} -> ${e.cause?.code || e.name || e.message}`;
            }
          }

          console.log("=== 1. DNS ===");
          for (const [h, note] of HOSTS) console.log(`  ${h.padEnd(22)} ${await dnsProbe(h)}   [${note}]`);

          console.log("");
          console.log("=== 2. TCP 443 · 한도 60초 (undici 우회) ===");
          for (const [h, note] of HOSTS) console.log(`  ${h.padEnd(22)} ${await tcpProbe(h, 443, 60000)}   [${note}]`);

          console.log("");
          console.log("=== 3. TLS 핸드셰이크 · 한도 60초 ===");
          for (const [h] of HOSTS) console.log(`  ${h.padEnd(22)} ${await tlsProbe(h, 60000)}`);

          console.log("");
          console.log("=== 4. TCP 443 · 한도 10초 (지금 배치가 겪는 조건) ===");
          for (const [h] of HOSTS) console.log(`  ${h.padEnd(22)} ${await tcpProbe(h, 443, 10000)}`);

          console.log("");
          console.log("=== 5. 실제 엔드포인트를 fetch로 (키 없이) ===");
          const URL_STOCK = "https://apis.data.go.kr/1160100/service/GetStockSecuritiesInfoService/getStockPriceInfo?resultType=json&numOfRows=1&pageNo=1";
          console.log("  " + await fetchProbe("기본(undici connect 10초)", URL_STOCK));
          console.log("  " + await fetchProbe("AbortSignal 60초", URL_STOCK, AbortSignal.timeout(60000)));
          console.log("  ^ 둘 다 10초 근처에서 죽으면 배치의 한계는 undici의 connect timeout이지");
          console.log("    전체 타임아웃이 아니다 — AbortSignal만 늘려서는 소용없다는 뜻.");

          console.log("");
          console.log("=== 6. undici 기본 connect timeout 실측 (블랙홀 IP) ===");
          console.log("  " + await fetchProbe("10.255.255.1", "http://10.255.255.1/"));
          PROBE
          echo "작성 완료"

      - name: 연결 진단 실행
        run: node /tmp/probe.mjs
