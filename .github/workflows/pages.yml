name: Deploy to GitHub Pages

# 정적 파일만 올리는 배포다. 서버는 없다 — 앱은 data/*.json을 fetch만 한다.
#
# push만으로는 배치 결과가 배포되지 않는다. 기본 GITHUB_TOKEN으로 만든 커밋은 다른
# 워크플로를 트리거하지 않기 때문이다(GitHub이 무한 루프를 막으려고 걸어 둔 제약).
# 그래서 배치는 매일 성공적으로 커밋했는데 사이트는 6일 전 시세를 계속 서빙했다:
#   저장소 HEAD  data/quotes.json → asOf 2026-08-12
#   monasset.kr/data/quotes.json → asOf 2026-08-07  (마지막 사람 커밋 시점)
#
# workflow_run은 커밋 이벤트가 아니라 "워크플로가 끝났다"는 이벤트라 그 제약을 받지
# 않는다. 배치에서 workflow_dispatch를 부르는 방식은 같은 제약에 걸려 별도 PAT가
# 필요하므로 쓰지 않는다. Pages 소스를 브랜치 배포로 바꾸는 것도 하지 않는다 —
# 유료로 붙여 둔 커스텀 도메인(monasset.kr)이 걸려 있다.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Daily domestic quotes batch", "Weekly ticker universe refresh", "Daily OECD indicators batch", "Daily market rates batch"]
    types: [completed]
  workflow_dispatch: {}

# 배치 워크플로와 권한이 겹치지 않게 여기서는 읽기만 한다(배포에 필요한 pages·id-token만 추가).
permissions:
  contents: read
  pages: write
  id-token: write

# 두 배치가 비슷한 시각에 끝나면 배포가 겹칠 수 있다. 마지막 것만 올라가면 되므로
# 진행 중인 배포는 취소한다. 배치 쪽 그룹(quotes-batch·tickers-batch)과는 이름이 달라
# 서로 막지 않는다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 실패한 배치의 결과를 배포하지 않는다. workflow_run은 성공·실패를 가리지 않고
    # 발화하므로 여기서 걸러야 한다. push·수동 실행은 그대로 통과시킨다.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # workflow_run은 트리거한 워크플로의 커밋이 아니라 기본 브랜치의 최신 상태를
      # 체크아웃한다. 배치가 방금 main에 커밋했으므로 그 커밋을 명시적으로 집는다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

      # 한 번만 사람이 해야 하는 설정이 있다: 저장소 Settings → Pages →
      # "Build and deployment" → Source를 "GitHub Actions"로 바꿔야 한다.
      # enablement:true로 자동화해 보려 했으나 실패했다 — Pages 사이트를 생성하는 API는
      # 저장소 관리자 권한을 요구하고 워크플로의 GITHUB_TOKEN에는 그 권한이 없다.
      # 설정을 켜기 전까지는 이 단계에서 멈추며, 켠 뒤 재실행하면 그대로 배포된다.
      - uses: actions/configure-pages@v5

      # 저장소 루트를 그대로 올린다. index.html이 진입점이고 data/·lib/는 상대 경로로
      # 참조하므로 하위 경로(/mon2/)에서도 그대로 동작한다.
      # 올라가는 것은 앱 코드와 공개 시세 데이터뿐이다 — API 키는 배치(Actions Secrets)에만
      # 있고 클라이언트 코드에 들어가지 않으며, 사용자의 자산 데이터는 브라우저
      # localStorage에만 있으므로 배포물에 포함되지 않는다.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
