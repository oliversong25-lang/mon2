name: Daily domestic quotes batch

on:
  schedule:
    # 14:17 KST daily (cron is UTC; KST = UTC+9).
    #
    # :00이 아닌 이유: 예약 워크플로는 정각 슬롯이 가장 붐빈다. 분을 옮겨 두면
    # 대기열이 짧아진다.
    #
    # 06:00이 아닌 이유: 금융위원회_주식시세정보는 기준일 "다음 영업일 13시 이후"에
    # 갱신된다. 06:00에 돌면 전일 데이터가 아직 없어 소급 조회가 그 전 영업일로
    # 내려가고, 결과적으로 항상 2영업일 전 종가를 쓰게 된다(실측: 8/11 06:38 실행이
    # 8/10 대신 8/7 종가를 가져옴). 제공 시각보다 1시간 뒤에 돌려 전일 종가를 잡는다.
    - cron: "17 5 * * *"
    # 두 번째 슬롯: 18:43 KST. 예약 이벤트는 보장이 아니라 대기열이라 밀리거나 아예
    # 버려진다(실측: "0 5" 슬롯이 75분 밀려 15:15 KST에 실행됐다). 앞 슬롯이 밀리거나
    # 사라져도 이 실행이 스스로 메운다 — 이미 최신이면 아무것도 커밋하지 않는다.
    - cron: "43 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: quotes-batch
  cancel-in-progress: false

jobs:
  build-quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run quotes batch
        id: batch
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KOREAEXIM_AUTH_KEY: ${{ secrets.KOREAEXIM_AUTH_KEY }}
          ECOS_AUTH_KEY: ${{ secrets.ECOS_AUTH_KEY }}
          ECOS_SILVER_STAT_CODE: ${{ secrets.ECOS_SILVER_STAT_CODE }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          # 유료 전환(Analyst 이상) 시 "pro"로 바꾼다 — 호스트와 인증 헤더가 달라진다.
          COINGECKO_PLAN: demo
        run: node scripts/build-quotes.mjs

      # 결과는 셋이다. 이 셋을 뭉치면 "아무 일도 안 한 실행"이 성공으로 읽힌다.
      #   updated        새 시세를 받아 커밋했다
      #   already-current 배치는 정상이었고 데이터가 이미 최신이라 커밋할 게 없었다
      #   failed          배치가 실패했다 (이 스텝까지 오지 못한다)
      - name: Commit data/quotes.json if it changed
        id: commit
        run: |
          if git diff --quiet -- data/quotes.json; then
            echo "outcome=already-current" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=already-current::quotes.json이 이미 최신입니다 (asOf $(node -p "require('./data/quotes.json').asOf")). 커밋할 변경이 없습니다."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/quotes.json
            git commit -m "data: refresh domestic quotes ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            # 주 1회 도는 종목 목록 배치(tickers.yml)도 같은 브랜치에 커밋하므로,
            # 두 배치가 겹친 주말에 push가 non-fast-forward로 튕길 수 있다.
            git pull --rebase origin main
            git push
            echo "outcome=updated" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=updated::quotes.json을 갱신해 커밋했습니다 (asOf $(node -p "require('./data/quotes.json').asOf"))."
          fi

      # 실행 요약에 결과를 한 줄로 남긴다. 로그를 열지 않고도 셋 중 무엇이었는지 보인다.
      - name: Record outcome
        if: always()
        run: |
          OUTCOME="${{ steps.commit.outputs.outcome }}"
          if [ "${{ job.status }}" != "success" ]; then OUTCOME="failed"; fi
          if [ -z "$OUTCOME" ]; then OUTCOME="failed"; fi
          echo "## 시세 배치 결과: $OUTCOME" >> "$GITHUB_STEP_SUMMARY"

      # GitHub does NOT notify anyone when a scheduled workflow fails — without this
      # step a batch could silently stop updating for weeks and the app would keep
      # serving stale (but structurally valid) data with no signal to anyone.
      - name: Open a tracking issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "quotes-batch-failure";
            const title = "시세 배치 실패: data/quotes.json 갱신 안 됨";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${new Date().toISOString()} 실행에서 시세 배치가 실패했습니다.\n\n실행 로그: ${runUrl}\n\n이 이슈는 배치가 다시 성공할 때까지 재사용됩니다 (중복 생성 없음). data/quotes.json은 마지막 성공 시점 값으로 남아있으니 원인 파악 전까지는 앱이 오래된 데이터로 계속 정상 동작합니다.`;
            if (existing.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }

      - name: Close the tracking issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "quotes-batch-failure";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            for (const issue of existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `${new Date().toISOString()} 실행에서 배치가 다시 성공했습니다. 이슈를 닫습니다.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
