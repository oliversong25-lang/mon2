<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>설정 · AssetFlow</title>
  <!-- 폰트는 렌더를 막지 않게 받는다. 도착 전에는 폴백으로 읽히고 도착하면 바뀐다. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="lib/app.css?v=20260813-1">
  <script src="lib/supabase-config.js?v=20260811-1"></script><script src="lib/account-store.js"></script><script src="lib/auth-guard.js"></script>
</head>
<body>
<div id="app"></div>
<script src="lib/shell.js?v=20260813-1"></script>
<script>
  const current=AccountStore.auth();
  Shell.mount("app","settings",`<header class="page-head"><div><p class="eyebrow">계정</p><h1>설정</h1></div></header><section class="card settings-card"><h2>로그인 계정</h2><p class="sub">${Shell.escapeHtml(current?.user?.email||"")}</p><button type="button" class="btn secondary" id="logout">로그아웃</button></section>`);
  document.getElementById("logout").addEventListener("click",()=>AccountStore.signOut());
</script>
</body>
</html>
